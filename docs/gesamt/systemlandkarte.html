<text x="40" y="1043" font-size="13.5" fill="#1d1d1b">1  Portal legt Projekte in Phrase an. Setzt jemand das Custom Field „AutoFix“, post-editiert AutoFix die Jobs im Schritt „PE Gemini“ mit dem Prompt aus dem Prompt Hub.</text>
<text x="40" y="1067" font-size="13.5" fill="#1d1d1b">2  Custom Field „Analysis Type“ → Analysis Hub erstellt Analyse + Quote beim Dienstleister und schließt nach Freigabe Workflow-Schritt 1 ab.</text>
<text x="40" y="1091" font-size="13.5" fill="#1d1d1b">3  Custom Field „Mention Digest“ → @Erwähnungen in Kommentaren gehen per Google Chat raus (gleicher Bot wie das Portal).</text>
<text x="40" y="1115" font-size="13.5" fill="#1d1d1b">4  Terminology Hub pflegt die Termbanken, die TermCheck, Portal (/termsearch), AutoFix und AutoLQA lesen.</text>
<text x="40" y="1139" font-size="13.5" fill="#1d1d1b">5  Rise Patcher ist im Portal (Campus) aufgegangen; beide schreiben in die Articulate-Registry und deployen nach Firebase.</text>
<text x="40" y="1163" font-size="13.5" fill="#1d1d1b">6  Alle Repositories: Code in src/, Tests in tests/, Doku in docs/ (DOKUMENTATION.md, ENDPOINTS.md, CI-CD.md), gleiche CI/CD.</text>
