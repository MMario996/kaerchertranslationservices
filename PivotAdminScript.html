<script>
// Pivot-Templates-Admin-JavaScript, ausgelagert aus AdminScript.html.
// Wird von loadPivotAdminContent_() (Index.html) als Script-Element injiziert,
// erst wenn der "Pivot Templates"-Subtab zum ersten Mal geoeffnet wird - siehe
// Kommentar in PivotAdminConsole.html zum Truncation-Problem, das dadurch
// vermieden wird. Laeuft im globalen Scope wie AdminScript.html selbst.
    function loadPivotLinks() {
        const tbody = document.getElementById('pivotLinksTableBody');
        const loading = document.getElementById('pivotLinksLoading');
        if (!tbody) return;
        if (loading) loading.style.display = 'block';
        google.script.run
          .withSuccessHandler(res => {
            if (loading) loading.style.display = 'none';
            if (!res.success) {
              tbody.innerHTML = '<tr><td colspan="5" style="color:#d93025;padding:15px;">' + escapeHtml(res.error || 'Error') + '</td></tr>';
              return;
            }
            renderPivotLinksTable(res.links || []);
          })
          .withFailureHandler(err => {
            if (loading) loading.style.display = 'none';
            tbody.innerHTML = '<tr><td colspan="5" style="color:#d93025;padding:15px;">Error: ' + escapeHtml(err.message) + '</td></tr>';
          })
          .apiGetPivotTemplateLinks();
    }

    // ============================================================================
    // Sprachen-Mapping ("Pivot languages" Custom Field)
    // ============================================================================

    /**
     * Fuellt die Sprach-Datalist mit ALLEN bekannten Sprachen (PRETTY_LANG_MAP,
     * dieselbe Liste wie im Upload-Formular) als Vorschlaege - das Feld selbst
     * ist ein freies Textfeld, admin kann also jederzeit auch einen eigenen,
     * dort nicht gelisteten Sprachcode eintippen.
     */
    function populatePivotLangMapDatalist_() {
        const dl = document.getElementById('pivotLangMapLangDatalist');
        if (!dl || typeof PRETTY_LANG_MAP === 'undefined') return;
        const codes = Object.keys(PRETTY_LANG_MAP).sort();
        dl.innerHTML = codes.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(PRETTY_LANG_MAP[c])}</option>`).join('');
    }

    /**
     * Fuellt die Options-Wert-Datalist mit den vollstaendigen Optionen des
     * "Pivot languages"-Custom-Fields als Vorschlaege - auch hier ein freies
     * Textfeld, falls ein Options-Wert (noch) nicht ueber die API auftaucht
     * oder ein eigener/neuer Kuerzel eingetragen werden soll.
     */
    function populatePivotLangMapValueDatalist_() {
        const dl = document.getElementById('pivotLangMapValueDatalist');
        if (!dl) return;
        google.script.run
          .withSuccessHandler(res => {
            if (!res.success) return;
            dl.innerHTML = (res.options || []).map(o => `<option value="${escapeHtml(o)}">`).join('');
          })
          .withFailureHandler(() => {})
          .apiGetPivotFieldOptionValues();
    }

    function loadPivotLanguageMap() {
        const tbody = document.getElementById('pivotLangMapTableBody');
        const loading = document.getElementById('pivotLangMapLoading');
        if (!tbody) return;
        if (loading) loading.style.display = 'block';
        google.script.run
          .withSuccessHandler(res => {
            if (loading) loading.style.display = 'none';
            if (!res.success) {
              tbody.innerHTML = '<tr><td colspan="3" style="color:#d93025;padding:15px;">' + escapeHtml(res.error || 'Error') + '</td></tr>';
              return;
            }
            renderPivotLanguageMapTable(res.map || []);
          })
          .withFailureHandler(err => {
            if (loading) loading.style.display = 'none';
            tbody.innerHTML = '<tr><td colspan="3" style="color:#d93025;padding:15px;">Error: ' + escapeHtml(err.message) + '</td></tr>';
          })
          .apiGetPivotLanguageMap();
    }

    function renderPivotLanguageMapTable(map) {
        const tbody = document.getElementById('pivotLangMapTableBody');
        if (!tbody) return;
        if (!map.length) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#888;padding:20px;">Noch keine Zuordnungen angelegt.</td></tr>';
            return;
        }
        tbody.innerHTML = map.map(m => `
          <tr>
            <td><strong>${escapeHtml(getPrettyLangName(m.langCode))}</strong> <span style="color:#888;font-size:11px;">(${escapeHtml(m.langCode)})</span></td>
            <td><code>${escapeHtml(m.optionValue)}</code></td>
            <td style="text-align:right;white-space:nowrap;">
              <span class="material-icons-outlined icon-btn-danger" title="Zuordnung entfernen" style="cursor:pointer;" onclick="removePivotLanguageMapping('${escapeJs(m.langCode)}')">delete</span>
            </td>
          </tr>
        `).join('');
    }

    function savePivotLanguageMapping() {
        const langSel = document.getElementById('newPivotLangMapLang');
        const valSel  = document.getElementById('newPivotLangMapValue');
        const lang = langSel ? langSel.value : '';
        const val  = valSel  ? valSel.value  : '';
        if (!lang || !val) { showCustomAlert('Bitte beide Felder auswaehlen.', 'Hinweis'); return; }
        google.script.run
          .withSuccessHandler(res => {
            if (!res.success) { showCustomAlert('Error: ' + res.error, 'Error'); return; }
            renderPivotLanguageMapTable(res.map || []);
          })
          .withFailureHandler(err => showCustomAlert('Error: ' + err.message, 'Error'))
          .apiSetPivotLanguageMapping(lang, val);
    }

    function removePivotLanguageMapping(langCode) {
        showCustomConfirm('Diese Zuordnung wirklich entfernen?', function() {
            google.script.run
              .withSuccessHandler(res => {
                if (!res.success) { showCustomAlert('Error: ' + res.error, 'Error'); return; }
                renderPivotLanguageMapTable(res.map || []);
              })
              .withFailureHandler(err => showCustomAlert('Error: ' + err.message, 'Error'))
              .apiRemovePivotLanguageMapping(langCode);
        });
    }

    function phraseTemplateEditUrl_(uid) {
        return 'https://cloud.memsource.com/tms/projectTemplate/edit/' + encodeURIComponent(uid);
    }

    function openPivotTemplateFromInput_(inputId) {
        const input = document.getElementById(inputId);
        const uid = input ? input.value.trim() : '';
        if (!uid) { showCustomAlert('Bitte zuerst eine UID eingeben.', 'Hinweis'); return; }
        window.open(phraseTemplateEditUrl_(uid), '_blank');
    }

    function renderPivotLinksTable(links) {
        const tbody = document.getElementById('pivotLinksTableBody');
        if (!tbody) return;
        if (!links.length) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#888;padding:20px;">Noch keine Verknuepfungen angelegt.</td></tr>';
            return;
        }
        tbody.innerHTML = links.map(l => `
          <tr>
            <td><a href="${phraseTemplateEditUrl_(l.parentUid)}" target="_blank" rel="noopener" style="font-weight:700;text-decoration:none;">${escapeHtml(l.parentName || l.parentUid)}</a><br><code style="font-size:11px;color:#888;">${escapeHtml(l.parentUid)}</code></td>
            <td><a href="${phraseTemplateEditUrl_(l.childUid)}" target="_blank" rel="noopener" style="font-weight:700;text-decoration:none;">${escapeHtml(l.childName || l.childUid)}</a><br><code style="font-size:11px;color:#888;">${escapeHtml(l.childUid)}</code></td>
            <td>${escapeHtml(l.childSourceLang || '-')}</td>
            <td>${(l.childTargetLangs || []).map(t => `<span class="pill-badge role" style="margin:1px;">${escapeHtml(t)}</span>`).join('') || '-'}</td>
            <td style="text-align:right;white-space:nowrap;">
              <span class="material-icons-outlined icon-btn-danger" title="Verknuepfung entfernen" style="cursor:pointer;" onclick="removePivotLink('${escapeJs(l.parentUid)}', '${escapeJs(l.childUid)}')">delete</span>
            </td>
          </tr>
        `).join('');
    }

    function addPivotLink() {
        const parentInput = document.getElementById('newPivotParentUid');
        const childInput  = document.getElementById('newPivotChildUid');
        const parentUid = parentInput ? parentInput.value.trim() : '';
        const childUid  = childInput  ? childInput.value.trim()  : '';
        if (!parentUid || !childUid) { showCustomAlert('Bitte beide UIDs eingeben.', 'Hinweis'); return; }
        google.script.run
          .withSuccessHandler(res => {
            if (!res.success) { showCustomAlert('Error: ' + res.error, 'Error'); return; }
            if (parentInput) parentInput.value = '';
            if (childInput) childInput.value = '';
            renderPivotLinksTable(res.links || []);

            // Nach dem Speichern direkt zu beiden Templates springen - Browser
            // blocken das ggf. als Popup (google.script.run ist async, also
            // kein "direkter" Klick-Kontext mehr); Fallback dann ueber die
            // anklickbaren Links in der Tabelle oben.
            const wP = window.open(phraseTemplateEditUrl_(parentUid), '_blank');
            const wC = window.open(phraseTemplateEditUrl_(childUid), '_blank');
            if (!wP || !wC) {
              showCustomAlert('Verknuepfung gespeichert. Dein Browser hat das automatische Oeffnen der Templates blockiert - bitte Pop-ups fuer diese Seite erlauben, oder die Namen in der Tabelle unten anklicken.', 'Gespeichert');
            }
          })
          .withFailureHandler(err => showCustomAlert('Error: ' + err.message, 'Error'))
          .apiAddPivotTemplateLink(parentUid, childUid);
    }

    function removePivotLink(parentUid, childUid) {
        showCustomConfirm('Diese Verknuepfung wirklich entfernen?', function() {
            google.script.run
              .withSuccessHandler(res => {
                if (!res.success) { showCustomAlert('Error: ' + res.error, 'Error'); return; }
                renderPivotLinksTable(res.links || []);
              })
              .withFailureHandler(err => showCustomAlert('Error: ' + err.message, 'Error'))
              .apiRemovePivotTemplateLink(parentUid, childUid);
        });
    }
</script>
