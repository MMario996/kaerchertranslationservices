name: CI

# Standard-Pipeline aller Kaercher-Translation-Repositories (Vorbild: Prompt Hub).
# Jede Aenderung (Pull Request, Aufruf aus dem Deploy-Workflow, naechtlich) durchlaeuft:
#   1. Statische Pruefungen: ESLint, Struktur (tools/check-structure.js), Zeichenkodierung
#   2. Logik-Tests (Node 20 + 22): Syntax aller src/*.gs, gemeinsamer Namensraum, Manifest
#   3. Browser-Tests der echten Oberflaeche (Chromium)
#   4. Sicherheit: Secret-Scan (gitleaks) und npm audit
#   5. Zusammenfassung im Job-Summary
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * *'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Lint & Qualitaet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: ESLint
        run: npm run lint
      - name: Struktur und Zeichenkodierung
        run: npm run check

  unit:
    name: Logik-Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  ui:
    name: Oberflaeche (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  security:
    name: Sicherheit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret-Scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  summary:
    name: Zusammenfassung
    if: always()
    needs: [static, unit, ui, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ergebnis
        env:
          R_STATIC: ${{ needs.static.result }}
          R_UNIT: ${{ needs.unit.result }}
          R_UI: ${{ needs.ui.result }}
          R_SECURITY: ${{ needs.security.result }}
        run: |
          icon() { case "$1" in success) echo "OK";; skipped) echo "übersprungen";; cancelled) echo "abgebrochen";; *) echo "FEHLER";; esac; }
          {
            echo "## CI"
            echo ""
            echo "| Prüfung | Ergebnis |"
            echo "|---|---|"
            echo "| Lint, Struktur, Kodierung | $(icon "$R_STATIC") |"
            echo "| Logik-Tests (Node 20/22) | $(icon "$R_UNIT") |"
            echo "| Oberfläche (Chromium) | $(icon "$R_UI") |"
            echo "| Sicherheit (gitleaks, npm audit) | $(icon "$R_SECURITY") |"
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "$R_STATIC" "$R_UNIT" "$R_UI" "$R_SECURITY"; do
            case "$r" in success|skipped) ;; *) exit 1;; esac
          done
