<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knowledge Base – Translation Services</title>
<!-- Knowledge Base: eigenstaendige Seite, ausgeliefert ueber doGet(?page=kb)
     (WebApp.gs), einbettbar in Google Sites. Aufbau und Stil wie das Portal
     (Sprachleiste, Reiterleiste, Kaercher-Glass-Karten). Keine Startseite:
     ein Reiter je Phrase-Produkt aus kb-src/*.md, geoeffnet wird das erste.
     Diese Seite enthaelt Oberflaeche + Inhaltsverzeichnis (Manifest, von
     tools/build-kb.js zwischen den KB_MANIFEST-Markern eingesetzt); die
     Artikel kommen paketweise per google.script.run.apiKbChunk(n)
     (KnowledgebaseApi.gs) und sind danach im Browser voll durchsuchbar.
     Keine externen Skripte oder Schriften. -->
<style>
  :root {
    --primary-yellow:#FFED00; --primary-black:#000; --k-surface:#fff; --k-surface-2:#f7f7f5; --k-ink:#1a1a1a; --k-ink-2:#6b6b6b; --k-line:#e8e8e4;
    --kg-fill:linear-gradient(135deg,#FFED00 0%,#FFD500 100%); --kg-ink:linear-gradient(135deg,#1c1c1c 0%,#3b3b3b 100%);
    --kg-tint:0 6px 18px -6px rgba(204,170,0,.55); --kg-tint-hi:0 10px 26px -8px rgba(204,170,0,.7);
    --kg-glass:rgba(255,255,255,.7); --kg-glass-hi:rgba(255,255,255,.86); --kg-hair:rgba(255,255,255,.75); --kg-blur:blur(20px) saturate(160%);
    --kg-elev:0 1px 2px rgba(40,36,10,.05), 0 8px 28px rgba(40,36,10,.07); --kg-elev-hi:0 2px 4px rgba(40,36,10,.06), 0 16px 40px rgba(40,36,10,.12);
    --kg-ring:0 0 0 3px rgba(255,221,0,.6); --kg-r:12px; --kg-r-lg:18px; --kg-ease:cubic-bezier(.16,.9,.3,1); --kg-wash:#f4f4f0;
    --code:#f2f2ee; --link:#0b57d0; --hover-row:#fffbe6;
    --note:#eef4fc; --note-b:#b7cdf0; --tip:#e9f6ec; --tip-b:#a8d8b4; --imp:#fff4dc; --imp-b:#f0c870;
    --i-blue:#e8f0fe; --i-blue-f:#1a56c4; --i-yel:#fff4c2; --i-yel-f:#7a5d00; --i-gr:#e6f4ea; --i-gr-f:#137333; --i-gray:#f1f1ee; --i-gray-f:#555;
  }
  html[data-theme="dark"] {
    --k-surface:#1b1d20; --k-surface-2:#24272b; --k-ink:#ececec; --k-ink-2:#a3a3a3; --k-line:#34373c; --kg-wash:#131416;
    --kg-glass:rgba(27,29,32,.82); --kg-glass-hi:rgba(36,39,43,.92); --kg-hair:rgba(255,255,255,.06);
    --kg-elev:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35); --kg-elev-hi:0 2px 4px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.5);
    --code:#24272b; --link:#8ab4f8; --hover-row:#2a2710;
    --note:#1c2a3d; --note-b:#2f4c75; --tip:#18301f; --tip-b:#2d5a39; --imp:#33290f; --imp-b:#6b5317;
    --i-blue:#1c2a3d; --i-blue-f:#8ab4f8; --i-yel:#3a3310; --i-yel-f:#ffe66b; --i-gr:#18301f; --i-gr-f:#81c995; --i-gray:#2a2d31; --i-gray-f:#bbb;
  }
  * { box-sizing:border-box; }
  html { scroll-padding-top:80px; }
  body { margin:0; font:15px/1.6 "Helvetica Neue", Helvetica, Arial, sans-serif; color:var(--k-ink); background:var(--kg-wash); -webkit-text-size-adjust:100%;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  a { color:var(--link); }
  button { font:inherit; color:inherit; }
  svg.i { width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle; }
  code, kbd { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:.88em; background:var(--code); padding:1px 5px; border-radius:5px; overflow-wrap:anywhere; }
  kbd { display:inline-block; min-width:18px; padding:1px 6px; border:1px solid var(--k-line); border-bottom-width:2px; border-radius:6px; background:var(--k-surface); font:700 11px/16px ui-monospace, Menlo, Consolas, monospace; text-align:center; }
  pre { background:var(--code); padding:12px 14px; border-radius:10px; overflow-x:auto; font-size:13px; line-height:1.5; border:1px solid var(--k-line); }
  pre code { background:none; padding:0; }
  mark { background:var(--primary-yellow); color:#000; padding:0 2px; border-radius:3px; }

  /* Kopfzeile wie im Portal: Sprachleiste rechts, darunter die Reiterleiste */
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 25px 4px; }
  .brand { display:flex; align-items:center; gap:10px; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--k-ink-2); background:none; border:none; cursor:pointer; padding:0; }
  .brand::before { content:""; width:18px; height:4px; border-radius:2px; background:var(--kg-fill); }
  .top-right { display:flex; align-items:center; gap:6px; }
  .lang-btn { background:var(--k-surface-2); border:none; padding:6px 12px; cursor:pointer; font-weight:700; color:var(--k-ink-2); font-size:12px; border-radius:8px; transition:background .15s; }
  .lang-btn.active { background:var(--kg-ink); color:var(--primary-yellow); }
  .hdr-icon-btn { background:none; border:none; cursor:pointer; padding:6px; color:var(--k-ink-2); display:inline-flex; align-items:center; border-radius:50%; margin-left:6px; }
  .hdr-icon-btn:hover { background:rgba(0,0,0,.06); color:var(--k-ink); }
  .tab-nav { position:sticky; top:0; z-index:60; display:flex; justify-content:center; gap:2px; padding:10px 25px 0; background:var(--kg-wash); border-bottom:1px solid var(--k-line); overflow-x:auto; scrollbar-width:none; transition:box-shadow .2s; }
  .tab-nav::-webkit-scrollbar { display:none; }
  .tab-nav.is-stuck { box-shadow:0 10px 18px -14px rgba(0,0,0,.35); }
  .tab-btn { display:inline-flex; align-items:center; gap:6px; padding:12px 26px; margin:0 3px; background:none; border:none; border-bottom:3px solid transparent; border-radius:10px 10px 0 0; font-size:14px; font-weight:700; color:var(--k-ink-2); cursor:pointer; text-transform:uppercase; letter-spacing:.3px; white-space:nowrap; transition:background-color .15s, color .15s; }
  .tab-btn:hover { background-color:rgba(0,0,0,.035); color:var(--k-ink); }
  .tab-btn.active { color:var(--k-ink); background:linear-gradient(var(--primary-yellow),var(--primary-yellow)) bottom / 100% 3px no-repeat; }
  .tab-btn .n { font-size:11px; font-weight:700; color:var(--k-ink-2); background:var(--k-surface-2); border-radius:999px; padding:0 7px; }
  .tab-btn:focus-visible, .lang-btn:focus-visible, .hdr-icon-btn:focus-visible, .h-btn:focus-visible, .seg-btn:focus-visible { outline:none; box-shadow:var(--kg-ring); }
  .container { padding:20px 25px 60px; }

  /* Karten, Titel, Buttons (Kaercher Glass) */
  .card { background:var(--k-surface); border:1px solid var(--k-line); border-top:5px solid var(--primary-yellow); border-radius:var(--kg-r-lg); box-shadow:var(--kg-elev); }
  .section-title { font-size:15px; font-weight:800; text-transform:uppercase; color:var(--k-ink); margin:0 0 12px; padding-bottom:10px; border-bottom:2px solid var(--k-line); display:flex; align-items:center; gap:8px; }
  .section-title .n { margin-left:auto; font-size:12px; color:var(--k-ink-2); font-weight:700; }
  .sec-head { margin:26px 2px 12px; font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.8px; }
  .h-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:46px; padding:0 20px; border-radius:var(--kg-r); border:1px solid transparent; font-size:14px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; cursor:pointer; white-space:nowrap; text-decoration:none; transition:box-shadow .15s var(--kg-ease), filter .15s; }
  .h-btn-fill { background:var(--kg-fill); color:#000; box-shadow:var(--kg-tint); }
  .h-btn-fill:hover { box-shadow:var(--kg-tint-hi); filter:saturate(1.15); }
  .h-btn-glass { background:var(--kg-glass-hi); border-color:var(--k-line); color:var(--k-ink); box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .h-btn-glass:hover { box-shadow:var(--kg-elev); border-color:var(--k-ink); }
  .h-btn-sm { height:36px; padding:0 14px; font-size:12px; }

  /* Suche (wie Portal-Startseite) */
  .h-search { position:relative; }
  .h-search svg { position:absolute; left:15px; top:15px; color:var(--k-ink-2); pointer-events:none; }
  #q { width:100%; height:50px; padding:0 96px 0 46px; border:1px solid var(--k-line); border-radius:14px; font:inherit; font-size:15px; background:var(--kg-glass-hi); color:var(--k-ink); box-shadow:var(--kg-elev); -webkit-appearance:none; appearance:none; transition:box-shadow .15s, border-color .15s; }
  #q:focus { outline:none; border-color:var(--k-ink); box-shadow:var(--kg-ring), var(--kg-elev); background:var(--k-surface); }
  #q::-webkit-search-cancel-button { display:none; }
  .h-kbd { position:absolute; right:12px; top:14px; display:flex; gap:3px; pointer-events:none; }
  .search-row { display:flex; gap:12px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
  .search-row .h-search { flex:1 1 420px; max-width:760px; }
  .status { font-size:12px; color:var(--k-ink-2); display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
  .status .dot { width:10px; height:10px; border-radius:50%; background:#e0b400; box-shadow:0 0 0 4px rgba(224,180,0,.18); }
  .status.ready .dot { background:#1e8e3e; box-shadow:0 0 0 4px rgba(30,142,62,.15); }

  /* Listen (wie Tabellen im Portal) */
  .rows a.row { display:flex; gap:12px; align-items:center; padding:11px 22px; border-bottom:1px solid var(--k-line); text-decoration:none; color:var(--k-ink); }
  .rows a.row:last-child { border-bottom:none; }
  .rows a.row:hover { background:var(--hover-row); }
  .rows .rt { font-weight:700; flex:1; min-width:0; }
  .rows .rm { font-size:12px; color:var(--k-ink-2); white-space:nowrap; }
  .status-badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; background:#fff6b3; color:#5c4d00; white-space:nowrap; }
  html[data-theme="dark"] .status-badge { background:#4a4210; color:#ffef7a; }

  /* Produkt / Artikel: Seitenleiste + Inhalt */
  .layout { display:grid; grid-template-columns:290px minmax(0,1fr); gap:20px; align-items:start; }
  nav.nav { position:sticky; top:74px; max-height:calc(100vh - 88px); overflow-y:auto; padding:14px 10px 12px; }
  .nav .nav-h { padding:0 8px 8px; margin:0 0 6px; }
  .nav details { margin:0; }
  .nav summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:6px; padding:7px 8px; border-radius:9px; font-weight:800; font-size:12.5px; text-transform:uppercase; letter-spacing:.3px; }
  .nav summary::-webkit-details-marker { display:none; }
  .nav summary::before { content:""; width:6px; height:6px; border-right:2px solid var(--k-ink-2); border-bottom:2px solid var(--k-ink-2); transform:rotate(-45deg); transition:transform .15s; flex:none; margin:0 4px 0 2px; }
  .nav details[open] > summary::before { transform:rotate(45deg); }
  .nav summary:hover, .nav a:hover { background:var(--k-surface-2); }
  .nav .cnt { margin-left:auto; font-size:11px; color:var(--k-ink-2); font-weight:700; }
  .nav a { display:block; padding:6px 8px 6px 24px; border-radius:8px; color:var(--k-ink); text-decoration:none; font-size:13px; line-height:1.35; }
  .nav a.active { background:var(--kg-ink); color:var(--primary-yellow); }
  html[data-theme="dark"] .nav a.active { background:var(--kg-fill); color:#000; }
  .seg { display:flex; gap:8px; flex-wrap:wrap; padding:10px 12px; margin-bottom:16px; background:var(--kg-glass); border:1px solid var(--kg-hair); border-radius:14px; box-shadow:var(--kg-elev); }
  .seg-btn { padding:7px 14px; border:1px solid transparent; border-radius:10px; background:transparent; font-size:12.5px; font-weight:700; text-transform:uppercase; cursor:pointer; color:var(--k-ink-2); }
  .seg-btn:hover { color:var(--k-ink); background:rgba(0,0,0,.035); }
  .seg-btn.active { background:var(--kg-ink); color:var(--primary-yellow); box-shadow:0 6px 14px -6px rgba(0,0,0,.5); }
  .seg-btn .n { opacity:.65; margin-left:4px; font-weight:600; }

  .crumbs { font-size:12.5px; color:var(--k-ink-2); display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .crumbs a { color:var(--k-ink-2); text-decoration:none; font-weight:800; text-transform:uppercase; font-size:11.5px; letter-spacing:.4px; }
  .crumbs a:hover { color:var(--k-ink); }
  .prod-head { padding:24px 28px; margin-bottom:18px; }
  .prod-head h1, article.doc h1 { font-size:28px; line-height:1.2; font-weight:800; letter-spacing:-.4px; margin:8px 0 8px; }
  .prod-head p { margin:0; color:var(--k-ink-2); }
  .sec-card { margin-bottom:16px; padding:18px 0 0; overflow:hidden; }
  .sec-card .section-title { margin:0 22px 8px; }
  .sec-card .desc { margin:0 22px 10px; font-size:13.5px; color:var(--k-ink-2); }

  .art-wrap { display:grid; grid-template-columns:minmax(0,1fr) 230px; gap:20px; align-items:start; }
  article.doc { padding:24px clamp(18px,3vw,36px) 32px; min-width:0; overflow-wrap:break-word; }
  .meta { display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:12.5px; color:var(--k-ink-2); padding-bottom:14px; margin-bottom:8px; border-bottom:2px solid var(--k-line); }
  .meta a { font-weight:700; display:inline-flex; align-items:center; gap:4px; }
  .content h3 { font-size:20px; margin:28px 0 8px; }
  .content h4 { font-size:16.5px; margin:22px 0 6px; }
  .content h5 { font-size:15px; margin:18px 0 6px; }
  .content h6 { font-size:13px; margin:16px 0 6px; color:var(--k-ink-2); text-transform:uppercase; letter-spacing:.4px; }
  .content ul, .content ol { padding-left:24px; }
  .content li { margin:4px 0; }
  .content li > p { margin:4px 0; }
  .content img { max-width:100%; height:auto; vertical-align:middle; border-radius:6px; }
  .content p > img:only-child { display:block; margin:10px 0; border:1px solid var(--k-line); }
  .content li img, .content td img, .content p img:not(:only-child) { max-height:22px; }
  .content .tbl { overflow-x:auto; margin:12px 0 16px; border:1px solid var(--k-line); border-radius:12px; }
  .content table { border-collapse:collapse; width:100%; font-size:13.5px; background:var(--k-surface); }
  .content th, .content td { text-align:left; vertical-align:top; padding:10px 12px; border-bottom:1px solid var(--k-line); }
  .content th { background:var(--k-surface-2); font-size:12px; font-weight:800; text-transform:uppercase; color:var(--k-ink-2); }
  .content tr:hover td { background:var(--hover-row); }
  .content tr:last-child td { border-bottom:none; }
  .content blockquote { margin:12px 0; padding:4px 14px; border-left:4px solid var(--k-line); color:var(--k-ink-2); }
  .callout { border-radius:12px; padding:10px 14px; margin:14px 0; font-size:14px; border:1px solid var(--note-b); background:var(--note); }
  .callout.tip { background:var(--tip); border-color:var(--tip-b); }
  .callout.important { background:var(--imp); border-color:var(--imp-b); }
  .callout-t { font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:.6px; margin-bottom:2px; }
  .callout > p:last-child { margin-bottom:2px; }
  .xref { border-bottom:1px dotted var(--k-ink-2); }
  .pager { display:flex; justify-content:space-between; gap:12px; margin-top:28px; padding-top:18px; border-top:2px solid var(--k-line); }
  .pager a { display:inline-flex; align-items:center; gap:10px; max-width:calc(50% - 6px); min-width:0; height:46px; padding:0 16px 0 6px; border:1px solid var(--k-line); border-radius:var(--kg-r);
    background:var(--kg-glass-hi); color:var(--k-ink); text-decoration:none; font-size:13px; font-weight:700; box-shadow:0 1px 2px rgba(0,0,0,.04); transition:box-shadow .15s, border-color .15s; }
  .pager a:hover { box-shadow:var(--kg-elev); border-color:var(--k-ink); }
  .pager a.next { margin-left:auto; padding:0 6px 0 16px; }
  .pager .pg-ico { width:34px; height:34px; flex:none; border-radius:9px; display:grid; place-items:center; background:var(--kg-fill); color:#000; box-shadow:var(--kg-tint); }
  .pager .pg-txt { min-width:0; display:flex; flex-direction:column; line-height:1.2; }
  .pager .pg-txt small { font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--k-ink-2); }
  .pager .pg-txt span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pager a.next .pg-txt { text-align:right; }
  aside.otp { position:sticky; top:74px; max-height:calc(100vh - 88px); overflow-y:auto; padding:14px; font-size:13px; }
  aside.otp b { display:block; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:var(--k-ink-2); margin-bottom:6px; }
  aside.otp a { display:block; padding:4px 8px; border-radius:7px; color:var(--k-ink); text-decoration:none; line-height:1.35; border-left:3px solid transparent; }
  aside.otp a:hover { background:var(--k-surface-2); }
  aside.otp a.on { border-left-color:var(--primary-yellow); background:var(--k-surface-2); font-weight:700; }

  /* Suchergebnisse */
  .results { overflow:hidden; }
  .results a.res { display:block; padding:14px 18px; border-bottom:1px solid var(--k-line); text-decoration:none; color:var(--k-ink); }
  .results a.res:last-child { border-bottom:none; }
  .results a.res:hover, .results a.res.sel { background:var(--hover-row); }
  .results .rt { font-weight:800; font-size:15.5px; }
  .results .bc { font-size:12px; color:var(--k-ink-2); margin:3px 0 5px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .results .sn { font-size:13.5px; color:var(--k-ink-2); }
  .res-head { display:flex; justify-content:space-between; gap:10px; margin:0 4px 10px; font-size:13px; color:var(--k-ink-2); flex-wrap:wrap; }

  .loading, .empty { padding:40px 20px; text-align:center; color:var(--k-ink-2); }
  .spinner { width:28px; height:28px; border:3px solid var(--k-line); border-top-color:var(--primary-yellow); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 10px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .to-top { position:fixed; right:18px; bottom:18px; width:46px; height:46px; border-radius:12px; background:var(--kg-ink); color:var(--primary-yellow); display:none; place-items:center; border:none; cursor:pointer; box-shadow:0 8px 20px -8px rgba(0,0,0,.5); z-index:30; }
  .to-top.on { display:grid; }
  .menu-btn { display:none !important; }
  .backdrop { display:none; }

  @media (max-width: 1250px) { .art-wrap { grid-template-columns:minmax(0,1fr); } aside.otp { display:none; } }
  @media (max-width: 900px) {
    .topbar, .tab-nav, .container { padding-left:12px; padding-right:12px; }
    .tab-nav { justify-content:flex-start; }
    .tab-btn { padding:10px 14px; font-size:13px; margin:0 1px; }
    .layout { grid-template-columns:minmax(0,1fr); }
    nav.nav { position:fixed; top:0; left:0; bottom:0; width:min(340px,86vw); max-height:none; z-index:80; border-radius:0 18px 18px 0; transform:translateX(-105%); transition:transform .2s; }
    nav.nav.open { transform:none; }
    .backdrop.on { display:block; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:75; }
    .has-nav .menu-btn { display:inline-flex !important; }
  }
  @media (max-width: 560px) {
    .topbar { gap:6px; }
    .lang-btn { padding:5px 7px; font-size:11px; white-space:nowrap; }
    .top-right { gap:3px; }
    .hdr-icon-btn { margin-left:0; }
    .brand { white-space:nowrap; font-size:0; gap:0; }
    .brand::before { width:22px; }
    .search-row { flex-wrap:wrap; gap:10px; }
    .search-row .h-search { flex:1 1 0; min-width:0; }
    .search-row .status { flex-basis:100%; }
    .h-kbd { display:none; }
    #q { padding-right:14px; }
    .prod-head h1, article.doc h1 { font-size:23px; }
    .pager { flex-direction:column; }
    .pager a { max-width:100%; }
    .status { white-space:normal; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div class="topbar">
  <button type="button" class="brand" id="brandBtn"><span>Translation Services · </span>Knowledge Base</button>
  <div class="top-right" id="langBar"></div>
</div>
<nav class="tab-nav" id="tabs" aria-label="Produkte"></nav>
<div class="container">

  function go(hash, replace) {
    hash = String(hash || '#/');
    if (!gsh) {
      if (replace) { history.replaceState(null, '', hash); curHash = hash; return; }
      if (location.hash === hash) route(); else location.hash = hash;
      return;
    }
    curHash = hash;
    try { gsh[replace ? 'replace' : 'push']({ h: hash }, { page: 'kb' }, hash.replace(/^#/, '')); } catch (e) {}
    if (!replace) route();
  }

  // ---- Ereignisse ----
  var typing = null;
  $('q').placeholder = T.search;
  $('q').addEventListener('input', function () {
    clearTimeout(typing);
    var v = this.value;
    typing = setTimeout(function () {
      selIdx = 0;
      if (v.trim()) {
        if (currentRoute.view === 'search') { go('#/s/' + encodeURIComponent(v), true); currentRoute = { view: 'search', q: v }; lastSearchTerms = terms(v); renderSearch(v, true); }
        else { go('#/s/' + encodeURIComponent(v)); $('q').focus(); }
      } else if (currentRoute.view === 'search') go('#/p/' + (lastProduct || firstProductKey()));
    }, 140);
  });
  $('q').addEventListener('keydown', function (e) {
    var items = document.querySelectorAll('#results .res');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!items.length) return;
      e.preventDefault();
      selIdx = Math.max(0, Math.min(items.length - 1, selIdx + (e.key === 'ArrowDown' ? 1 : -1)));
      Array.prototype.forEach.call(items, function (el, i) { el.classList.toggle('sel', i === selIdx); });
      if (items[selIdx].scrollIntoView) items[selIdx].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      if (items[selIdx]) { e.preventDefault(); go(items[selIdx].getAttribute('href')); }
    } else if (e.key === 'Escape') {
      this.value = ''; if (currentRoute.view === 'search') go('#/p/' + (lastProduct || firstProductKey())); this.blur();
    }
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target || {};
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || '')) return;
    if (e.key === '/' || ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'k')) { e.preventDefault(); $('q').focus(); $('q').select(); }
  });
  function closeNav() { var n = $('nav'); if (n) n.classList.remove('open'); $('backdrop').classList.remove('on'); }
  document.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target : null;
    if (!t) return;
    var g = t.closest('[data-go]');
    if (g) { e.preventDefault(); go(g.getAttribute('data-go')); return; }
    var l = t.closest('.lang-btn');
    if (l) { store.set('appLang', l.getAttribute('data-lang')); location.reload(); return; }
    if (t.closest('#themeBtn')) {
      theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      store.set('kts_kb_theme', theme); applyTheme(theme); return;
    }
    var sp = t.closest('[data-sp]');
    if (sp) { searchProduct = sp.getAttribute('data-sp'); selIdx = 0; renderSearch(currentRoute.q, true); return; }
    if (t.closest('#brandBtn')) { $('q').value = ''; go('#/p/' + firstProductKey()); return; }
    if (t.closest('#menuBtn')) { var n = $('nav'); if (n) { n.classList.add('open'); $('backdrop').classList.add('on'); } return; }
    if (t.closest('#backdrop')) { closeNav(); return; }
    if (t.closest('#toTop')) { window.scrollTo(0, 0); return; }
    var a = t.closest('a[href]');
    if (!a || e.defaultPrevented || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey) return;
    var href = a.getAttribute('href') || '';
    if (href.charAt(0) === '#') { e.preventDefault(); go(href.length > 1 ? href : '#/'); return; }
    if (/^https?:/i.test(href)) a.setAttribute('target', '_blank');
  });
  if (gsh) {
    try { gsh.setChangeHandler(function (e) { curHash = (e && e.state && e.state.h) || (e && e.location && e.location.hash ? '#' + e.location.hash : '#/'); route(); }); } catch (e) {}
  } else {
    window.addEventListener('hashchange', function () { curHash = String(location.hash || ''); route(); });
  }
  window.addEventListener('scroll', function () {
    $('toTop').classList.toggle('on', window.scrollY > 600);
    $('tabs').classList.toggle('is-stuck', window.scrollY > 40);
    var otp = $('otp');
    if (!otp) return;
    var links = otp.querySelectorAll('a'), on = null;
    for (var i = 0; i < links.length; i++) {
      var h = document.getElementById(links[i].getAttribute('data-h'));
      if (h && h.getBoundingClientRect().top < 120) on = links[i];
    }
    Array.prototype.forEach.call(links, function (l) { l.classList.toggle('on', l === on); });
  }, { passive: true });

  // ---- Start ----
  document.documentElement.lang = lang;
  renderLangBar();
  updateStatus();
  if (gsh && google.script.url && google.script.url.getLocation) {
    google.script.url.getLocation(function (loc) { curHash = loc && loc.hash ? '#' + String(loc.hash).replace(/^#/, '') : ''; route(); });
  } else {
    route();
  }
  loadAllInBackground();
})();
</script>
</body>
</html>
