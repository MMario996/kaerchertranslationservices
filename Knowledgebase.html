<style>
  :root {

    --note:#eef4fc; --note-b:#b7cdf0; --tip:#e9f6ec; --tip-b:#a8d8b4; --imp:#fff4dc; --imp-b:#f0c870;
  }
  html[data-theme="dark"] {

  a { color:var(--link); }
  button { font:inherit; color:inherit; }
  svg.i { width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle; }

  kbd { border:1px solid var(--line); border-bottom-width:2px; font-size:11px; font-weight:700; }

  pre code { background:none; padding:0; }
  mark { background:var(--y); color:#000; padding:0 2px; border-radius:3px; }

  /* Kopfzeile */
  header.top { position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:14px; padding:12px clamp(12px,3vw,28px); background:var(--glass);
    -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); flex:none; cursor:pointer; background:none; border:none; padding:0; }
  .brand-mark { width:36px; height:36px; border-radius:10px; background:var(--fill); display:grid; place-items:center; font-weight:900; color:#000; font-size:16px; box-shadow:0 6px 18px -6px rgba(204,170,0,.55); }
  .brand div b { display:block; font-size:14px; line-height:1.2; text-transform:uppercase; letter-spacing:.4px; text-align:left; }
  .brand div span { display:block; font-size:11.5px; color:var(--ink2); line-height:1.2; text-align:left; }
  .search { position:relative; flex:1; max-width:680px; }
  .search svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink2); }
  #q { width:100%; height:42px; padding:0 70px 0 38px; border:1px solid var(--line); border-radius:12px; font:inherit; font-size:15px; background:var(--card); color:var(--ink); }
  #q:focus { outline:none; box-shadow:var(--ring); border-color:var(--ink); }
  .search .hint { position:absolute; right:10px; top:50%; transform:translateY(-50%); display:flex; gap:3px; }
  .top-actions { display:flex; gap:6px; align-items:center; flex:none; }
  .icon-btn { display:inline-grid; place-items:center; width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--card); cursor:pointer; color:var(--ink); }
  .icon-btn:hover { box-shadow:var(--elev); }
  .icon-btn:focus-visible, .chip:focus-visible, .nav a:focus-visible { outline:none; box-shadow:var(--ring); }
  .menu-btn { display:none; }
  .status { font-size:11.5px; color:var(--ink2); white-space:nowrap; display:flex; align-items:center; gap:6px; }
  .status .dot { width:8px; height:8px; border-radius:50%; background:#e6c200; }
  .status.ready .dot { background:#1e8e3e; }

  /* Produkt-Filter */
  .chips { display:flex; gap:6px; flex-wrap:wrap; padding:10px clamp(12px,3vw,28px) 0; }
  .chip { border:1px solid var(--line); background:var(--glass); border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:800; cursor:pointer; text-transform:uppercase; letter-spacing:.3px; }
  .chip .n { opacity:.6; font-weight:600; margin-left:5px; }
  .chip.active { background:var(--inkfill); color:var(--y); border-color:transparent; box-shadow:0 6px 14px -6px rgba(0,0,0,.5); }
  html[data-theme="dark"] .chip.active { background:var(--fill); color:#000; }
  html[data-theme="dark"] .nav a.active { background:var(--fill); color:#000; }

  nav.nav { position:sticky; top:78px; max-height:calc(100vh - 92px); overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:10px; box-shadow:var(--elev); }

  .nav summary::-webkit-details-marker { display:none; }
  .nav summary::before { content:""; width:6px; height:6px; border-right:2px solid var(--ink2); border-bottom:2px solid var(--ink2); transform:rotate(-45deg); transition:transform .15s; flex:none; margin:0 3px; }
  .nav details[open] > summary::before { transform:rotate(45deg); }
  .nav summary:hover, .nav a:hover { background:var(--card2); }
  .nav .prod > summary { text-transform:uppercase; letter-spacing:.4px; font-size:12.5px; }
  .nav .sec { margin-left:10px; }
  .nav .sec > summary { font-weight:700; color:var(--ink2); font-size:12.5px; }
  .nav a { display:block; padding:5px 8px 5px 24px; border-radius:8px; color:var(--ink); text-decoration:none; font-size:13px; line-height:1.35; }
  .nav a.active { background:var(--inkfill); color:var(--y); }
  .nav .cnt { margin-left:auto; font-size:11px; color:var(--ink2); font-weight:600; }
  main { min-width:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--elev); }

  /* Startansicht */
  .hero { padding:26px 28px; margin-bottom:18px; }
  .eyebrow { font-size:12px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink2); display:flex; align-items:center; gap:8px; }
  .eyebrow::before { content:""; width:18px; height:4px; background:var(--y); border-radius:2px; }
  h1 { font-size:30px; line-height:1.2; margin:8px 0 6px; }
  .hero p { margin:0; color:var(--ink2); max-width:760px; }
  .kpis { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .kpi { background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:8px 14px; font-size:12px; color:var(--ink2); }
  .kpi b { display:block; font-size:20px; color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; margin-bottom:22px; }
  .pcard { padding:18px 18px 16px; cursor:pointer; text-align:left; transition:box-shadow .15s; display:flex; flex-direction:column; gap:6px; }
  .pcard:hover { box-shadow:var(--elev-hi); }
  .pcard .pn { font-weight:900; font-size:17px; display:flex; align-items:center; gap:8px; }
  .pcard .pn::before { content:""; width:10px; height:10px; border-radius:3px; background:var(--fill); }
  .pcard .pd { font-size:13px; color:var(--ink2); flex:1; }
  .pcard .pm { font-size:12px; color:var(--ink2); font-weight:700; }
  h2.sec-h { font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink2); margin:6px 0 10px; }
  .list { padding:6px; }
  .list a.row { display:flex; gap:10px; align-items:baseline; padding:9px 12px; border-radius:10px; text-decoration:none; color:var(--ink); }
  .list a.row:hover { background:var(--card2); }
  .list .rt { font-weight:700; flex:1; }
  .list .rm { font-size:12px; color:var(--ink2); white-space:nowrap; }
  .tag { display:inline-block; font-size:10.5px; font-weight:800; padding:1px 8px; border-radius:999px; background:var(--card2); border:1px solid var(--line); color:var(--ink2); text-transform:uppercase; letter-spacing:.3px; white-space:nowrap; }
  .tag.p { background:#fff6b3; color:#5c4d00; border-color:transparent; }
  html[data-theme="dark"] .tag.p { background:#4a4210; color:#ffef7a; }

  /* Suchergebnisse */
  .results .res { display:block; padding:14px 16px; border-radius:12px; text-decoration:none; color:var(--ink); border-bottom:1px solid var(--line); }

  .results .res:hover, .results .res.sel { background:var(--card2); }
  .results .res .rt { font-weight:800; font-size:15.5px; }
  .results .res .bc { font-size:12px; color:var(--ink2); margin:2px 0 4px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .results .res .sn { font-size:13.5px; color:var(--ink2); }
  .res-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:0 4px 10px; font-size:13px; color:var(--ink2); flex-wrap:wrap; }

  /* Artikel */
  .art-wrap { display:grid; grid-template-columns:minmax(0,1fr) 230px; gap:22px; align-items:start; }
  article.doc { padding:26px clamp(18px,3vw,36px) 34px; min-width:0; overflow-wrap:break-word; }
  .crumbs { font-size:12.5px; color:var(--ink2); display:flex; flex-wrap:wrap; gap:6px; align-items:center; }

  .crumbs a:hover { color:var(--ink); }
  article.doc h1 { font-size:28px; margin:10px 0 8px; }
  .meta { display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:12.5px; color:var(--ink2); padding-bottom:14px; margin-bottom:6px; border-bottom:1px solid var(--line); }

  .content h3 { font-size:20px; margin:28px 0 8px; padding-top:4px; }

  .content h5 { font-size:15px; margin:18px 0 6px; }

  .content th, .content td { text-align:left; vertical-align:top; padding:8px 10px; border-bottom:1px solid var(--line); }

  .content tr:last-child td { border-bottom:none; }
  .content blockquote { margin:12px 0; padding:4px 14px; border-left:4px solid var(--line); color:var(--ink2); }

  .callout.tip { background:var(--tip); border-color:var(--tip-b); }
  .callout.important { background:var(--imp); border-color:var(--imp-b); }
  .callout-t { font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:.6px; margin-bottom:2px; }

  .xref { border-bottom:1px dotted var(--ink2); }
  .pager { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:26px; }

  aside.otp { position:sticky; top:78px; max-height:calc(100vh - 92px); overflow-y:auto; padding:14px; font-size:13px; }

  aside.otp a:hover { background:var(--card2); }
  aside.otp a.on { border-left-color:var(--y); background:var(--card2); font-weight:700; }
  .loading { padding:40px; text-align:center; color:var(--ink2); }
  .spinner { width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--y); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 10px; }

  .empty { padding:30px 20px; text-align:center; color:var(--ink2); }
  .to-top { position:fixed; right:18px; bottom:18px; width:44px; height:44px; border-radius:12px; background:var(--inkfill); color:var(--y); display:none; place-items:center; border:none; cursor:pointer; box-shadow:0 8px 20px -8px rgba(0,0,0,.5); z-index:30; }

    .layout { grid-template-columns:minmax(0,1fr); }
    nav.nav { position:fixed; top:0; left:0; bottom:0; width:min(340px,86vw); max-height:none; z-index:60; border-radius:0 18px 18px 0; transform:translateX(-105%); transition:transform .2s; }
    nav.nav.open { transform:none; }
    .backdrop.on { display:block; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:55; }
    .menu-btn { display:inline-grid; }
    .brand div { display:none; }
    .status { display:none; }
    .search .hint { display:none; }
    #q { padding-right:12px; }
  }
  @media (max-width: 560px) {
    header.top { gap:8px; }
    .chips { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding-bottom:4px; }
    .chips::-webkit-scrollbar { display:none; }
    .chip { flex:none; }
    h1 { font-size:24px; }
    article.doc h1 { font-size:23px; }
    .pager { grid-template-columns:1fr; }
    .hero { padding:20px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>

<script>
(function () {

      stand: 'As of', notFound: 'Article not found.', loadErr: 'Content could not be loaded', retry: 'Try again', open: 'Open' }
  }[lang];

  // ---- Pakete laden (google.script.run -> apiKbChunk) ----
  var runner = (window.google && google.script && google.script.run) ? google.script.run : null;
  function indexChunk(obj) {
    var tpl = document.createElement('template');
    Object.keys(obj).forEach(function (id) {
      html[id] = obj[id];
      tpl.innerHTML = obj[id];
      plain[id] = (tpl.content.textContent || '').replace(/\s+/g, ' ');
      text[id] = plain[id].toLowerCase();

  }
  function loadChunk(n, cb) {
    if (cb) (chunkWaiters[n] = chunkWaiters[n] || []).push(cb);
    if (chunkState[n] === 2) { flush(n, null); return; }
    if (chunkState[n] === 1) return;
    chunkState[n] = 1;
    if (!runner) { chunkState[n] = -1; flush(n, new Error('google.script.run')); return; }
    runner.withSuccessHandler(function (raw) {

      catch (e) { chunkState[n] = -1; flush(n, e); }

  function flush(n, err) { (chunkWaiters[n] || []).splice(0).forEach(function (f) { f(err); }); }
  function loadAllInBackground() {

      loadChunk(n, function () { setTimeout(pump, 30); });

    pump(); pump();
  }
  function allLoaded() { return loadedChunks >= M.chunks; }
  function updateStatus() {
    var st = $('status');
    st.classList.toggle('ready', allLoaded());
    $('statusText').textContent = allLoaded() ? M.articles.length + ' ' + T.articles + ' · ' + T.ready : T.loading + ' ' + loadedChunks + '/' + M.chunks;

  // ---- Navigation (linke Spalte) ----

        var d = el.parentNode;

      }
    });
    navScrolled = false;

  var navScrolled = false;

  // ---- Ansichten ----
  function renderHome() {
    var main = $('main');
    var prods = M.products.map(function (p, pi) {

      return '<button type="button" class="card pcard" data-open-p="' + esc(p.key) + '"><span class="pn">' + esc(p.name) + '</span><span class="pd">' + esc(p.desc) + '</span>' +
        '<span class="pm">' + n + ' ' + esc(T.articles) + ' · ' + (p.sections || []).length + ' ' + esc(T.sections) + '</span></button>';
    }).join('');
    var recent = M.articles.filter(function (a) { return !product || prodOf(a).key === product; })
      .slice().sort(function (x, y) { return String(y.d).localeCompare(String(x.d)); }).slice(0, 12);
    main.innerHTML =
      '<section class="card hero"><div class="eyebrow">' + esc(T.heroEyebrow) + '</div><h1>' + esc(T.heroTitle) + '</h1><p>' + esc(T.heroText) + '</p>' +
      '<div class="kpis"><div class="kpi"><b>' + M.articles.length + '</b>' + esc(T.articles) + '</div><div class="kpi"><b>' + M.products.length + '</b>' + esc(T.products) + '</div>' +

  function rowHtml(a) {

  }
  function renderProduct(key) {

      '<div class="kpis"><div class="kpi"><b>' + arts.length + '</b>' + esc(T.articles) + '</div><div class="kpi"><b>' + (p.sections || []).length + '</b>' + esc(T.sections) + '</div></div></section>';

  function renderArticle(id, anchor, hl) {
    var a = byId[id];
    var main = $('main');
    if (!a) { main.innerHTML = '<div class="card empty">' + esc(T.notFound) + '</div>'; return; }
    if (html[id] == null) {
      main.innerHTML = '<div class="card loading"><div class="spinner"></div>' + esc(a.t) + '</div>';

        if (currentRoute.view !== 'article' || currentRoute.id !== id) return;

          main.innerHTML = '<div class="card empty">' + esc(T.loadErr) + (err && err.message ? ': ' + esc(err.message) : '') +
            '<br><br><button type="button" class="chip" id="retryBtn">' + esc(T.retry) + '</button></div>';
          var rb = $('retryBtn'); if (rb) rb.onclick = function () { chunkState[a.c] = 0; renderArticle(id, anchor, hl); };
          return;
        }
        renderArticle(id, anchor, hl);
      });
      return;
    }
    var p = prodOf(a), s = secOf(a);
    var sib = articlesOf(a.p);
    var k = sib.indexOf(a);
    var prev = sib[k - 1], next = sib[k + 1];
    var crumbs = '<a href="#/">' + esc(T.home) + '</a> › <a href="#/p/' + esc(p.key) + '">' + esc(p.name) + '</a>' +
      (s.t ? ' › ' + s.t.split(' › ').map(esc).join(' › ') : '');

  /** Markiert Suchbegriffe im Artikel (nur Textknoten), gibt das erste <mark> zurueck. */
  function highlight(root, terms) {
    if (!root || !terms.length) return null;
    var re = new RegExp('(' + terms.map(function (t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')', 'gi');
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var nodes = [];
    while (walker.nextNode()) { if (re.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode); re.lastIndex = 0; }
    var first = null;
    nodes.slice(0, 400).forEach(function (n) {
      var span = document.createElement('span');
      span.innerHTML = esc(n.nodeValue).replace(re, '<mark>$1</mark>');
      if (!first) first = span.querySelector('mark');
      n.parentNode.replaceChild(span, n);
    });
    return first;
  }

  // ---- Suche ----
  function terms(q) {
    return String(q || '').toLowerCase().replace(/["„“]/g, ' ').split(/\s+/).filter(function (t) { return t.length >= 2; }).slice(0, 8);

  function search(q) {
    var ts = terms(q);
    var full = String(q || '').toLowerCase().trim();
    if (!ts.length) return [];
    var out = [];
    M.articles.forEach(function (a) {
      if (product && prodOf(a).key !== product) return;
      var title = a.t.toLowerCase();
      var heads = (a.h || []).map(function (h) { return h[1]; }).join(' ').toLowerCase();
      var body = text[a.id];
      var score = 0;
      for (var i = 0; i < ts.length; i++) {
        var t = ts[i], inT = title.indexOf(t) !== -1, inH = heads.indexOf(t) !== -1;
        var inB = body ? body.indexOf(t) !== -1 : false;
        if (!inT && !inH && !inB) return; // alle Begriffe muessen vorkommen
        score += (inT ? 12 : 0) + (inH ? 5 : 0);
        if (inB) { var c = 0, pos = -1; while (c < 12 && (pos = body.indexOf(t, pos + 1)) !== -1) c++; score += c; }
      }
      if (title.indexOf(full) !== -1) score += 25;
      if (body && full.indexOf(' ') !== -1 && body.indexOf(full) !== -1) score += 10;
      out.push({ a: a, score: score });
    });
    out.sort(function (x, y) { return y.score - x.score || x.a.t.localeCompare(y.a.t); });
    return out;
  }
  function snippet(a, ts) {
    var body = text[a.id];
    if (!body) return '';
    var pos = -1;
    for (var i = 0; i < ts.length && pos < 0; i++) pos = body.indexOf(ts[i]);
    if (pos < 0) pos = 0;
    var start = Math.max(0, pos - 90), end = Math.min(body.length, pos + 170);
    var orig = plain[a.id] && plain[a.id].length === body.length ? plain[a.id] : body;
    var raw = (start ? '… ' : '') + orig.slice(start, end) + (end < body.length ? ' …' : '');
    var re = new RegExp('(' + ts.map(function (t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')', 'gi');
    return esc(raw).replace(re, '<mark>$1</mark>');
  }
  var selIdx = 0;
  function renderSearch(q, keepScroll) {
    var ts = terms(q);
    var res = search(q);
    var list = res.slice(0, 80);
    selIdx = Math.min(selIdx, Math.max(0, list.length - 1));
    var head = '<div class="res-head"><span>' + res.length + ' ' + esc(T.results) + ' „' + esc(q) + '“' + (product ? ' · ' + esc((M.products.filter(function (p) { return p.key === product; })[0] || {}).name) : '') + '</span>' +
      (allLoaded() ? '' : '<span>' + esc(T.titlesOnly) + '</span>') + '</div>';
    var body = list.length ? '<div class="card results" id="results">' + list.map(function (r, i) {
      var a = r.a, s = secOf(a);
      return '<a class="res' + (i === selIdx ? ' sel' : '') + '" href="#/a/' + esc(a.id) + '" data-id="' + esc(a.id) + '"><div class="rt">' + snippetTitle(a.t, ts) + '</div>' +
        '<div class="bc"><span class="tag p">' + esc(prodOf(a).name.replace(/^Phrase /, '')) + '</span>' + esc(s.t) + (a.d ? ' · ' + esc(fmtDate(a.d)) : '') + '</div>' +
        '<div class="sn">' + snippet(a, ts) + '</div></a>';
    }).join('') + '</div>' : '<div class="card empty">' + esc(T.noHits) + '</div>';
    $('main').innerHTML = head + body;
    if (!keepScroll) window.scrollTo(0, 0);
  }
  function snippetTitle(t, ts) {
    var re = new RegExp('(' + ts.map(function (x) { return x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')', 'gi');
    return ts.length ? esc(t).replace(re, '<mark>$1</mark>') : esc(t);
  }

  // ---- Routing: #/  #/p/<key>  #/a/<id>[/<anker>]  #/s/<suche> ----
  var currentRoute = { view: 'home' };
  var lastSearchTerms = [];
  function parseHash() {
    var h = decodeURIComponent(String(location.hash || '').replace(/^#\/?/, ''));
    var m;
    if ((m = /^a\/([^/]+)(?:\/(.+))?$/.exec(h))) return { view: 'article', id: m[1], anchor: m[2] || '' };
    if ((m = /^p\/(.+)$/.exec(h))) return { view: 'product', key: m[1] };
    if ((m = /^s\/(.*)$/.exec(h))) return { view: 'search', q: m[1] };
    return { view: 'home' };
  }
  function route() {
    var prev = currentRoute;
    currentRoute = parseHash();
    if (currentRoute.view === 'search') {
      if ($('q').value !== currentRoute.q) $('q').value = currentRoute.q;
      lastSearchTerms = terms(currentRoute.q);
      renderSearch(currentRoute.q);
    } else if (currentRoute.view === 'article') {
      var hl = prev.view === 'search' ? lastSearchTerms : null;
      renderArticle(currentRoute.id, currentRoute.anchor, hl);
    } else if (currentRoute.view === 'product') {
      renderProduct(currentRoute.key);
    } else {
      renderHome();
    }
    markNav();
    closeNav();
  }
  function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }

  // ---- Ereignisse ----
  var typing = null;
  $('q').placeholder = T.search;
  $('q').addEventListener('input', function () {
    clearTimeout(typing);
    var v = this.value;
    typing = setTimeout(function () {
      selIdx = 0;
      if (v.trim()) {
        if (currentRoute.view === 'search') { history.replaceState(null, '', '#/s/' + encodeURIComponent(v)); currentRoute = { view: 'search', q: v }; lastSearchTerms = terms(v); renderSearch(v); }
        else go('#/s/' + encodeURIComponent(v));
      } else if (currentRoute.view === 'search') go('#/');
    }, 140);
  });
  $('q').addEventListener('keydown', function (e) {
    var items = document.querySelectorAll('#results .res');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!items.length) return;
      e.preventDefault();
      selIdx = Math.max(0, Math.min(items.length - 1, selIdx + (e.key === 'ArrowDown' ? 1 : -1)));
      Array.prototype.forEach.call(items, function (el, i) { el.classList.toggle('sel', i === selIdx); });
      if (items[selIdx].scrollIntoView) items[selIdx].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      if (items[selIdx]) { e.preventDefault(); go(items[selIdx].getAttribute('href')); }
    } else if (e.key === 'Escape') {
      this.value = ''; if (currentRoute.view === 'search') go('#/'); this.blur();
    }
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target || {};
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || '')) return;
    if (e.key === '/' || ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'k')) { e.preventDefault(); $('q').focus(); $('q').select(); }
  });
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.chip') : null;
    if (!b) return;
    product = b.getAttribute('data-p') || '';
    store.set('kts_kb_product', product);
    renderChips(); renderNav();
    if (currentRoute.view === 'search') renderSearch(currentRoute.q);
    else if (currentRoute.view === 'home' || currentRoute.view === 'product') go(product ? '#/p/' + product : '#/');
  });
  $('main').addEventListener('click', function (e) {
    var c = e.target.closest ? e.target.closest('[data-open-p]') : null;
    if (c) go('#/p/' + c.getAttribute('data-open-p'));
  });
  $('nav').addEventListener('click', function (e) { if (e.target.tagName === 'A') navScrolled = true; });
  $('brandBtn').addEventListener('click', function () { $('q').value = ''; go('#/'); });
  $('themeBtn').addEventListener('click', function () {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    theme = dark ? 'light' : 'dark';
    store.set('kts_kb_theme', theme);
    applyTheme(theme);
  });
  function closeNav() { $('nav').classList.remove('open'); $('backdrop').classList.remove('on'); }
  $('menuBtn').addEventListener('click', function () { $('nav').classList.add('open'); $('backdrop').classList.add('on'); });
  $('backdrop').addEventListener('click', closeNav);
  window.addEventListener('hashchange', route);
  window.addEventListener('scroll', function () {
    $('toTop').classList.toggle('on', window.scrollY > 600);
    var otp = $('otp');
    if (!otp) return;
    var links = otp.querySelectorAll('a'), on = null;
    for (var i = 0; i < links.length; i++) {
      var h = document.getElementById(links[i].getAttribute('data-h'));
      if (h && h.getBoundingClientRect().top < 120) on = links[i];
    }
    Array.prototype.forEach.call(links, function (l) { l.classList.toggle('on', l === on); });
  }, { passive: true });
  $('toTop').addEventListener('click', function () { window.scrollTo(0, 0); });

  // ---- Start ----
  $('brandSub').textContent = M.products.map(function (p) { return p.name.replace(/^Phrase /, ''); }).join(' · ');
  renderChips();
  renderNav();
  updateStatus();
  route();
  loadAllInBackground();
})();
</script>
</body>
</html>
