<style>

  /* PREFERENCES TOGGLE CSS */

  /* --- DOC BOARD (Kanban) ----------------------- */

  .dl-options-3 { grid-template-columns: repeat(3, 1fr); }
  .dl-option { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin: 0; padding: 16px; border: 2px solid #e2e2e2; background: #fff; cursor: pointer; font-size: 14px; font-weight: 400; line-height: 1.4; color: #333; transition: border-color 0.15s, background 0.15s; }
  .dl-option:hover { border-color: #999; }
  .dl-option input[type="radio"] { position: absolute; top: 14px; right: 14px; margin: 0; }
  .dl-option > .material-icons-outlined { font-size: 28px; color: #777; }
  .dl-option small { color: #888; font-size: 12.5px; }
  .dl-option:has(input:checked) { border-color: var(--primary-black); background: #fffbe0; box-shadow: inset 0 0 0 1px var(--primary-black); }
  .dl-option:has(input:checked) > .material-icons-outlined { color: #000; }
  .dl-option.disabled { opacity: 0.45; cursor: not-allowed; }
  .dl-hint { font-size: 13px; color: #777; margin-top: 8px; line-height: 1.5; }
  .dl-hint-warn { background: #fff3f3; border: 1px solid #ffcdd2; color: #c62828; padding: 10px 12px; }
  .dl-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 26px; }
  .dl-foot .btn i { margin-right: 8px; }
  .dl-progress { background: #fff; padding: 36px 44px; text-align: center; width: 440px; max-width: 100%; border-top: 6px solid var(--primary-yellow); box-shadow: 0 24px 60px rgba(0,0,0,0.25); box-sizing: border-box; }
  .dl-progress h3 { margin: 0 0 8px; font-size: 18px; }
  .dl-progress p { margin: 0; color: #777; font-size: 14px; line-height: 1.5; }
  .dl-errors { margin-top: 14px; background: #fff3f3; border: 1px solid #ffcdd2; color: #c62828; padding: 10px 12px; font-size: 13px; text-align: left; }
  .btn-download { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border: 1px solid var(--primary-black); background: var(--primary-yellow); color: #000; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.3px; cursor: pointer; white-space: nowrap; transition: background 0.15s; }
  .btn-download:hover { background: #e6d500; }
  .btn-download .material-icons-outlined { font-size: 18px; }
  .toast-host { position: fixed; right: 20px; bottom: 20px; z-index: 7000; display: flex; flex-direction: column; gap: 10px; max-width: calc(100vw - 40px); }
  .toast { display: flex; align-items: center; gap: 10px; min-width: 280px; max-width: 460px; background: #111; color: #fff; padding: 12px 12px 12px 16px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border-left: 5px solid var(--primary-yellow); animation: toastIn 0.25s ease-out; transition: opacity 0.4s, transform 0.4s; }
  .toast-ok { border-left-color: #8bc34a; }
  .toast-ok > .material-icons-outlined:first-child { color: #8bc34a; }
  .toast-err { border-left-color: #e57373; }
  .toast-msg { flex: 1; }
  .toast a { color: var(--primary-yellow); font-weight: 700; text-decoration: none; white-space: nowrap; }
  .toast button { background: none; border: none; color: #aaa; cursor: pointer; padding: 2px; display: flex; }
  .toast-hide { opacity: 0; transform: translateY(10px); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (max-width: 700px) {
    .dl-modal { padding: 22px 18px; }
    .dl-options-2, .dl-options-3 { grid-template-columns: 1fr; }
    .dl-option { flex-direction: row; align-items: center; padding: 12px 44px 12px 12px; }
    .dl-foot .btn { flex: 1 1 0 !important; }
    .btn-download-label { display: none; }
    .toast-host { left: 12px; right: 12px; bottom: 12px; }
    .toast { min-width: 0; max-width: none; }
  }

  /* ===== Lesbarkeit: Mindestschriftgroessen =====
     Viele Bereiche sind mit Inline-Styles in 9-12px gebaut; eingebettet in
     Google Sites wirkt das winzig. Hier ein Boden fuer alle Stellen, ohne
     jede einzelne Inline-Angabe anzufassen. */
  body { font-size: 15px; }
  [style*="font-size:9px"], [style*="font-size: 9px"] { font-size: 11.5px !important; }
  [style*="font-size:10px"], [style*="font-size: 10px"] { font-size: 12px !important; }
  [style*="font-size:11px"], [style*="font-size: 11px"] { font-size: 13px !important; }
  [style*="font-size:12px"], [style*="font-size: 12px"] { font-size: 13.5px !important; }
  [style*="font-size:13px"], [style*="font-size: 13px"] { font-size: 14px !important; }
  .tab-btn { font-size: 14px; }
  .history-table { font-size: 14px; }
  .history-table th { font-size: 12.5px; }
  .status-badge { font-size: 11.5px; }
  .filter-input { font-size: 13px; }
  label { font-size: 14.5px; }
  .doc-board-col-header { font-size: 13px; }
  .doc-board-col-count, .doc-board-mini-badge, .doc-board-badge-more { font-size: 11px; }
  .doc-board-project-name { font-size: 14px; }
  .doc-board-file-row, .doc-board-meta-box { font-size: 13px; }
  .doc-board-card { font-size: 13.5px; }
  .doc-board-card-file { font-size: 12px; }
  .docsub-btn { font-size: 14px; }
  .btn-refresh { font-size: 13px; }

  /* ===== Kalender ===== */
  .cal-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .cal-nav { display: flex; align-items: center; gap: 6px; }
  .cal-btn { height: 40px; min-width: 40px; display: inline-flex; align-items: center; justify-content: center; background: #fff; border: 1px solid #d5d5d5; cursor: pointer; font-size: 13px; font-weight: 800; text-transform: uppercase; padding: 0 10px; }
  .cal-btn:hover { border-color: #000; }
  .cal-title { font-size: 20px; font-weight: 800; margin-left: 10px; text-transform: capitalize; }
  .cal-views { display: flex; border: 1px solid #d5d5d5; }
  .cal-view-btn { height: 40px; padding: 0 18px; background: #fff; border: none; cursor: pointer; font-size: 13px; font-weight: 800; text-transform: uppercase; color: #555; }
  .cal-view-btn.active { background: #000; color: var(--primary-yellow); }
  .cal-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: #666; margin-bottom: 12px; }
  .cal-legend > span { display: inline-flex; align-items: center; gap: 6px; }
  .cal-dot { width: 12px; height: 12px; display: inline-block; }
  .cal-dot.cal-open { background: var(--primary-yellow); } .cal-dot.cal-done { background: #8bc34a; }
  .cal-dot.cal-cancelled { background: #e57373; } .cal-dot.cal-overdue { background: #c62828; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .cal-head { font-size: 13px; font-weight: 800; text-transform: uppercase; color: #777; padding: 6px 8px; }
  .cal-cell { min-height: 128px; background: #fff; border: 1px solid #e6e6e6; padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; transition: border-color 0.15s; }
  .cal-cell:hover { border-color: #999; }
  .cal-outside { background: #fafafa; }
  .cal-outside .cal-daynum { color: #bbb; }
  .cal-daynum { display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 700; color: #333; margin-bottom: 2px; }
  .cal-is-today .cal-daynum { color: #000; }
  .cal-cell.cal-is-today { border: 2px solid #000; }
  .cal-is-today .cal-daynum::before { content: ""; }
  .cal-count { font-size: 11px; background: #f0f0f0; color: #555; padding: 1px 7px; border-radius: 10px; font-weight: 700; }
  .cal-chip { display: block; width: 100%; text-align: left; border: none; border-left: 4px solid #ccc; background: #f5f5f5; padding: 4px 6px; font-size: 13px; line-height: 1.3; color: #222; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; font-family: inherit; }
  .cal-chip:hover, .cal-card:hover { filter: brightness(0.96); }
  .cal-chip.cal-open, .cal-card.cal-open { border-left-color: #e6c200; background: #fffbe0; }
  .cal-chip.cal-done, .cal-card.cal-done { border-left-color: #8bc34a; background: #f1f8e9; }
  .cal-chip.cal-cancelled, .cal-card.cal-cancelled { border-left-color: #e57373; background: #ffebee; color: #888; }
  .cal-chip.cal-overdue, .cal-card.cal-overdue { border-left-color: #c62828; background: #ffebee; font-weight: 700; }
  .cal-more { background: none; border: none; padding: 2px 0; text-align: left; font-size: 12.5px; font-weight: 700; color: #1a73e8; cursor: pointer; }
  .cal-week { gap: 8px; }
  .cal-wday { background: #fff; border: 1px solid #e6e6e6; min-height: 420px; display: flex; flex-direction: column; min-width: 0; }
  .cal-wday.cal-is-today { border: 2px solid #000; }
  .cal-wday-head { padding: 10px; border-bottom: 1px solid #eee; display: flex; flex-direction: column; gap: 2px; font-size: 13px; font-weight: 800; text-transform: uppercase; color: #555; }
  .cal-wday-date { font-size: 17px; color: #111; text-transform: none; }
  .cal-is-today .cal-wday-head { background: var(--primary-yellow); color: #000; }
  .cal-wday-body { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .cal-card { display: flex; flex-direction: column; gap: 6px; width: 100%; text-align: left; border: none; border-left: 4px solid #ccc; padding: 8px 10px; cursor: pointer; font-family: inherit; }
  .cal-card-name { font-size: 14px; font-weight: 700; color: #222; line-height: 1.3; word-break: break-word; }
  .cal-card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .cal-card .status-badge { min-width: 0; }
  .cal-card-langs { font-size: 12px; color: #666; }
  .cal-empty { color: #ccc; text-align: center; padding: 10px; }
  @media (max-width: 900px) {
    .cal-week { grid-template-columns: 1fr; }
    .cal-wday { min-height: 0; }
    .cal-wday-head { flex-direction: row; justify-content: space-between; align-items: baseline; }
  }
  @media (max-width: 700px) {
    .cal-title { font-size: 16px; width: 100%; margin: 6px 0 0; order: 5; }
    .cal-nav { flex-wrap: wrap; }
    .cal-grid.cal-month { gap: 2px; }
    .cal-head { font-size: 11px; padding: 4px 2px; text-align: center; }
    .cal-cell { min-height: 58px; padding: 4px; }
    .cal-cell .cal-chip, .cal-cell .cal-more { display: none; }
    .cal-daynum { font-size: 13px; flex-direction: column; gap: 2px; }
    .cal-cell.has-items .cal-count { background: #000; color: var(--primary-yellow); }
  }

  /* ===== Dokumentation ===== */

  /* ===== Navigation: Neues Projekt + Bereiche ===== */
  .nav-ico { font-size: 20px; vertical-align: -5px; margin-right: 6px; }

  .portal-nav.open { display: flex; }

  .portal-nav .tab-btn.active { background: #000; color: var(--primary-yellow); border-color: #000; }

    .portal-nav { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; margin-top: -4px; }
    .portal-nav .tab-btn { flex-shrink: 0; }

  /* ===== Projekt-Detailansicht ===== */
  .project-name-link { background: none; border: none; padding: 0; font: inherit; font-weight: 700; color: #111; text-align: left; cursor: pointer; }
  .project-name-link:hover { text-decoration: underline; text-decoration-color: var(--primary-yellow); text-decoration-thickness: 3px; }
  .drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 5500; display: flex; justify-content: flex-end; }
  .drawer { width: 520px; max-width: 100vw; height: 100%; background: #fff; border-left: 6px solid var(--primary-yellow); box-shadow: -20px 0 50px rgba(0,0,0,0.2); display: flex; flex-direction: column; animation: drawerIn 0.2s ease-out; }
  @keyframes drawerIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 22px 24px 12px; }
  .drawer-head h3 { margin: 8px 0 0; font-size: 19px; line-height: 1.3; word-break: break-word; }
  .drawer-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 24px 16px; border-bottom: 1px solid #eee; }
  .pd-action { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; background: #fff; border: 1px solid #d5d5d5; font-size: 12.5px; font-weight: 700; text-transform: uppercase; cursor: pointer; color: #333; text-decoration: none; font-family: inherit; }
  .pd-action:hover { border-color: #000; background: #fffbe0; }
  .pd-action.danger { color: #c62828; }
  .pd-action .material-icons-outlined, .btn-download .material-icons-outlined { font-size: 18px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 8px 24px 30px; }
  .pd-section { padding: 16px 0; border-bottom: 1px solid #f0f0f0; }
  .pd-section h4 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.4px; color: #666; display: flex; justify-content: space-between; align-items: center; }
  .pd-row { display: flex; justify-content: space-between; gap: 16px; padding: 6px 0; font-size: 14px; }
  .pd-label { color: #888; flex-shrink: 0; }
  .pd-value { text-align: right; word-break: break-word; }
  .pd-value a { color: #1a73e8; }
  .pd-file { color: #666; font-size: 12.5px; margin-right: 6px; }
  .pd-note { white-space: pre-wrap; font-size: 14px; background: #fafafa; border-left: 3px solid var(--primary-yellow); padding: 10px 12px; }
  .pd-muted { color: #999; font-style: italic; }
  .pd-link { background: none; border: none; color: #1a73e8; cursor: pointer; font-size: 12.5px; font-weight: 700; text-transform: uppercase; }
  .pd-steps { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; }
  .pd-steps li { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; color: #aaa; text-align: center; position: relative; }
  .pd-steps li::before { content: ""; position: absolute; top: 11px; left: -50%; width: 100%; height: 2px; background: #e5e5e5; z-index: 0; }
  .pd-steps li:first-child::before { display: none; }

  @media (max-width: 700px) { .drawer { border-left: none; border-top: 6px solid var(--primary-yellow); } .pd-steps li span:last-child { font-size: 9px; } }

  /* ===== Campus: Unterreiter Preview-Generator ===== */

  .art-input-icon input { padding-left:42px; }

  .art-batch-chev { margin-left:auto; color:#999; font-size:22px !important; text-transform:none; letter-spacing:normal; font-weight:normal; transition:transform 0.2s; }
  .art-batch[open] .art-batch-chev { transform:rotate(180deg); }
  .kec-debug-card { max-width:900px; }
  .kec-debug-row { display:flex; gap:10px; flex-wrap:wrap; align-items:stretch; }
  .kec-debug-row .btn { height:auto; min-height:46px; }
  .art-count { font-size:12px; color:#888; font-weight:600; margin-left:6px; text-transform:none; }
  .art-search { height:38px; padding:0 12px; font-size:13px; margin-bottom:12px; }

  .art-item-name { font-weight:700; font-size:14px; word-break:break-word; }
  .art-lang { font-size:11px; font-weight:800; background:#f1f1f1; padding:2px 8px; white-space:nowrap; }
