// --- CUSTOM DIALOG LOGIC ------------------------------------------------------
let customDialogCallback = null;

function showCustomAlert(message, title = "Hinweis / Info") {
    document.getElementById('customDialogTitle').innerText = title;
    document.getElementById('customDialogMessage').innerHTML = message;
    document.getElementById('customDialogInput').style.display = 'none';
    document.getElementById('customDialogCancelBtn').style.display = 'none';
    document.getElementById('customDialogConfirmBtn').innerText = "OK";
    
    customDialogCallback = null;
    document.getElementById('customDialogOverlay').style.display = 'flex';
}

function showCustomConfirm(message, onConfirmCallback, title = "Bitte bestätigen / Confirm") {
    document.getElementById('customDialogTitle').innerText = title;
    document.getElementById('customDialogMessage').innerText = message;
    document.getElementById('customDialogInput').style.display = 'none';
    document.getElementById('customDialogCancelBtn').style.display = 'inline-flex';
    document.getElementById('customDialogConfirmBtn').innerText = "YES / JA";
    
    customDialogCallback = onConfirmCallback;
    document.getElementById('customDialogOverlay').style.display = 'flex';
}

function showCustomPrompt(message, defaultValue, onConfirmCallback, title = "Eingabe erforderlich / Input required") {
    document.getElementById('customDialogTitle').innerText = title;
    document.getElementById('customDialogMessage').innerText = message;
    
    const inp = document.getElementById('customDialogInput');
    inp.style.display = 'block';
    inp.value = defaultValue || "";
    
    document.getElementById('customDialogCancelBtn').style.display = 'inline-flex';
    document.getElementById('customDialogConfirmBtn').innerText = "OK";
    
    customDialogCallback = onConfirmCallback;
    document.getElementById('customDialogOverlay').style.display = 'flex';
    setTimeout(() => inp.focus(), 100);
}

function closeCustomDialog() {
    document.getElementById('customDialogOverlay').style.display = 'none';
    customDialogCallback = null;
}

function confirmCustomDialog() {
    const inputVal = document.getElementById('customDialogInput').value;
    const cb = customDialogCallback;
    closeCustomDialog();
    if (cb) cb(inputVal);
}

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('customDialogInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            confirmCustomDialog();
        }
    });
});

// --- SPRACHWECHSEL LOGIK (Wörterbuch) ---
// Alle UI-Woerterbuecher (de, en, fr, es, pt, zh) liegen serverseitig in
// I18nDicts.gs. Die aktive Sprache und Englisch (Rueckfall) reisen mit
// apiGetConfig() mit, weitere Sprachen laedt loadI18nDict_() bei Bedarf.
// Grund: das ausgelieferte Dokument darf nicht zu gross werden - Apps Script
// schneidet es sonst mitten in einem <script>-Block ab (siehe
// tests/ui.consistency.test.js, Groessengrenze).
const i18n = {};

let currentLang = localStorage.getItem('appLang') || 'en';

var SUPPORTED_LANGS_ = ['de', 'en', 'fr', 'es', 'pt', 'zh'];

// FIX: Fehlt ein W?rterbuch f?r die gew?hlte Sprache (oder ein einzelner Key darin),
// f?llt die App auf Englisch zur?ck statt eine Exception zu werfen. Ohne diesen Fallback
// blieb die Seite komplett leer/"h?ngt", sobald `lang` kein Key in `i18n` war (z.B. bei
// einem alten/fremden Wert in localStorage, oder sobald neue Sprachen im Umschalter
// auftauchen, bevor jede einzelne UI-Zeichenkette f?r sie ?bersetzt ist).
function t_i18n_(lang, key) {
  const dict = i18n[lang] || i18n.en;
  return (dict && dict[key]) || (i18n.en && i18n.en[key]) || '';
}

/** Kurzform fuer Uebersetzungen mit Fallback-Text. */
function tr_(key, fallback) {
  return t_i18n_(currentLang, key) || fallback || key;
}

// FIX: Zeigt f?r einen mehrsprachigen Block (z.B. "guide-text-<lang>") den Block der
// gew?hlten Sprache, und f?llt auf Englisch (dann Deutsch) zur?ck, wenn f?r diese
// Sprache noch kein eigener Block existiert ? damit eine Seite NIE leer bleibt, nur
// weil eine ?bersetzung f?r eine neu hinzugef?gte Sprache noch aussteht.
function _showLangBlock_(prefix, lang) {
  const target = document.getElementById(prefix + '-' + lang) ? lang
    : (document.getElementById(prefix + '-en') ? 'en' : 'de');
  SUPPORTED_LANGS_.forEach(l => {
    const el = document.getElementById(prefix + '-' + l);
    if (el) el.style.display = (l === target) ? 'block' : 'none';
  });
}

var _i18nPending_ = {};
var _i18nFailed_  = {};

// Laedt ein ausgelagertes Woerterbuch (fr/es/pt/zh) nach und ruft danach cb().
// Mehrfachanfragen fuer dieselbe Sprache werden zusammengefasst.
function loadI18nDict_(lang, cb) {
  if (i18n[lang]) { cb(); return; }
  if (_i18nPending_[lang]) { _i18nPending_[lang].push(cb); return; }
  _i18nPending_[lang] = [cb];
  function done() {
    var cbs = _i18nPending_[lang] || [];
    delete _i18nPending_[lang];
    cbs.forEach(function(f) { f(); });
  }
  google.script.run
    .withSuccessHandler(function(dict) {
      if (dict) i18n[lang] = dict; else _i18nFailed_[lang] = true;
      done();
    })
    .withFailureHandler(function() { _i18nFailed_[lang] = true; done(); })
    .apiGetI18nDict(lang);
}

/** Wendet data-i18n / data-i18n-title / data-i18n-placeholder unterhalb von root an. */
function applyI18nIn_(root, lang) {
  lang = lang || currentLang;
  (root || document).querySelectorAll('[data-i18n]').forEach(el => {
    const val = t_i18n_(lang, el.getAttribute('data-i18n'));
    if (val) el.innerHTML = val;
  });
  (root || document).querySelectorAll('[data-i18n-title]').forEach(el => {
    const val = t_i18n_(lang, el.getAttribute('data-i18n-title'));
    if (val) { el.title = val; el.setAttribute('aria-label', val); }
  });
  // Ueberschrift mit fester Ergaenzung, z. B. "Projektinfo (Marketing)".
  (root || document).querySelectorAll('[data-i18n-text]').forEach(el => {
    const val = t_i18n_(lang, el.getAttribute('data-i18n-text'));
    if (val) el.innerHTML = val + (el.getAttribute('data-i18n-suffix') || '');
  });
  (root || document).querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const val = t_i18n_(lang, el.getAttribute('data-i18n-placeholder'));
    if (val) el.placeholder = val;
  });
  // Uebersetzte Labels verlieren ihr "?" (innerHTML) - wieder anhaengen.
  if (typeof initContextHelp_ === 'function') initContextHelp_(root || document);
}

// Admin-Woerterbuch (AdminI18n.gs) wird erst mit dem Admin-Bereich geladen und
// in i18n[lang] eingemischt; Englisch dient als Rueckfall fuer fehlende Keys.
var _adminI18nLoaded_ = {};
function loadAdminI18n_(lang, cb) {
  if (_adminI18nLoaded_[lang]) { if (cb) cb(); return; }
  _adminI18nLoaded_[lang] = true;
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.dict) {
        i18n[lang] = Object.assign(i18n[lang] || {}, res.dict);
        if (res.en) i18n.en = Object.assign(i18n.en || {}, res.en);
      }
      if (cb) cb();
    })
    .withFailureHandler(function() { _adminI18nLoaded_[lang] = false; if (cb) cb(); })
    .apiGetAdminI18n(lang);
}

function setGlobalLang(lang, done) {
  if (SUPPORTED_LANGS_.indexOf(lang) === -1) lang = 'en';
  if (!i18n[lang]) {
    // Noch nicht geladen -> nachholen und danach erneut anlaufen. Ist das
    // Nachladen bereits gescheitert, bleibt es bei Englisch statt einer
    // Endlosschleife.
    if (_i18nFailed_[lang]) lang = 'en';
    else { loadI18nDict_(lang, function() { setGlobalLang(lang, done); }); return; }
  }
  currentLang = lang;
  localStorage.setItem('appLang', lang);
  if (typeof _adminContentLoaded_ !== 'undefined' && _adminContentLoaded_ && !_adminI18nLoaded_[lang]) {
    loadAdminI18n_(lang, function() { setGlobalLang(lang, done); });
    return;
  }

  SUPPORTED_LANGS_.forEach(l => {
    const btn = document.getElementById('glb-' + l);
    if (btn) btn.classList.toggle('active', lang === l);
  });

  applyI18nIn_(document, lang);

  document.querySelectorAll('input[id^="templateSearch_"]').forEach(el => {
      el.placeholder = t_i18n_(lang, "ph_search_template");
  });

  document.querySelectorAll('[id^="sourceLangDisplay"]').forEach(el => {
      if(el.innerText.includes("Select Source Language") || el.innerText.includes("Quellsprache auswählen")) {
          el.innerHTML = `<span style='color:#999'>${t_i18n_(lang, 'txt_select_source')}</span>`;
      }
  });
  document.querySelectorAll('[id^="targetLangText"]').forEach(el => {
      if(el.innerText.includes("Select Target Language") || el.innerText.includes("Zielsprache(n) auswählen") || el.innerText === "-") {
          el.innerHTML = `<span style='color:#777'>${t_i18n_(lang, 'txt_select_target')}</span>`;
      }
  });

  const ownFilter = document.getElementById('ownershipFilter');
  if (ownFilter) {
      ownFilter.options[0].text = t_i18n_(lang, 'opt_all');
      ownFilter.options[1].text = t_i18n_(lang, 'opt_own');
      ownFilter.options[2].text = t_i18n_(lang, 'opt_shared');
  }

  _showLangBlock_('marketing-text', lang);
  _showLangBlock_('guide-text', lang);
  _showLangBlock_('faq-text', lang);

  document.querySelectorAll('[id^="note_"]').forEach(el => {
    const isMkt = el.id.includes('marketing');
    el.placeholder = isMkt ? t_i18n_(lang, 'ph_note_marketing') : t_i18n_(lang, 'ph_note_standard');
  });

  document.querySelectorAll('[id^="templateUid_"]').forEach(sel => {
    const firstOpt = sel.querySelector('option[disabled]');
    if (firstOpt) firstOpt.text = t_i18n_(lang, 'opt_select_template');
  });
  // Status-Chips / Leerzustand in "Meine Projekte" in der neuen Sprache neu zeichnen.
  if (globalProjects && globalProjects.length) globalSearch();
  if (typeof currentHistoryView !== 'undefined' && currentHistoryView === 'calendar') renderCalendar(globalProjects);
  if (typeof renderAnnouncements_ === 'function') renderAnnouncements_();
  rerenderDynamicI18n_();
  if (typeof done === 'function') done();
}

// gebraucht werden, bevor das Woerterbuch der Zielsprache geladen ist.

  zh: { title: '正在切换语言', msgs: ['你好！👋', '请稍候……', '马上就好……', '正在整理文字……', '快好了……'] }
};
let langSwitchTimer_ = null;
let langSwitchShownAt_ = 0;

/** Klick auf DE/EN/FR/...: kurzer Ladebildschirm, bis die neue Sprache steht. */
function switchLanguage_(lang) {
  if (lang === currentLang) return;
  showLangSwitchOverlay_(lang);
  setGlobalLang(lang, hideLangSwitchOverlay_);
}

function showLangSwitchOverlay_(lang) {
  const t = LANG_SWITCH_TEXT_[lang] || LANG_SWITCH_TEXT_.en;
  let o = document.getElementById('langSwitchOverlay');
  if (!o) {
    o = document.createElement('div');
    o.id = 'langSwitchOverlay';
    o.className = 'lang-switch-overlay';
    o.innerHTML = '<div class="lang-switch-box"><div class="loader"></div><div class="lang-switch-title"></div><div class="lang-switch-msg"></div></div>';
    document.body.appendChild(o);
  }
  o.querySelector('.lang-switch-title').textContent = t.title;
  const msg = o.querySelector('.lang-switch-msg');
  let i = 0;
  msg.textContent = t.msgs[0];
  msg.classList.remove('fade');
  if (langSwitchTimer_) clearInterval(langSwitchTimer_);
  langSwitchTimer_ = setInterval(() => {
    msg.classList.add('fade');
    setTimeout(() => { i = (i + 1) % t.msgs.length; msg.textContent = t.msgs[i]; msg.classList.remove('fade'); }, 200);
  }, 900);
  langSwitchShownAt_ = Date.now();
  o.classList.add('show');
}

function hideLangSwitchOverlay_() {
  // Mindestens kurz sichtbar lassen, sonst wirkt es wie ein Flackern.
  const wait = Math.max(0, 1300 - (Date.now() - langSwitchShownAt_));
  setTimeout(() => {
    const o = document.getElementById('langSwitchOverlay');
    if (o) o.classList.remove('show');
    if (langSwitchTimer_) { clearInterval(langSwitchTimer_); langSwitchTimer_ = null; }
  }, wait);
}

/** Zeichnet per JavaScript erzeugte Bereiche in der aktuellen Sprache neu. */
function rerenderDynamicI18n_() {
  try {
    if (typeof dbxData_ !== 'undefined' && dbxData_) { dbxFillSelects_(); dbxRender_(); }
    if (typeof accData_ !== 'undefined' && accData_) renderAccessMatrix_();
    if (typeof annList_ !== 'undefined' && typeof renderAnnouncementsAdmin_ === 'function') renderAnnouncementsAdmin_(annList_);
    if (typeof pvLinks_ !== 'undefined' && typeof pvAfterDataChange_ === 'function' && document.getElementById('pvLinks')) pvAfterDataChange_();
    const home = document.getElementById('tab-home');
    if (home && home.classList.contains('active') && typeof paintHome_ === 'function' && homeLoadedAt_) paintHome_(globalProjects);
    const np = document.getElementById('notifPanel');
    if (np && np.style.display !== 'none' && typeof renderNotifList_ === 'function') renderNotifList_();
  } catch (e) { console.warn('rerenderDynamicI18n_', e); }
}

// --- STARTUP ------------------------------------------------------------------
function startStartupOverlay_() {
  const o = document.getElementById('overlay');
  if(o) {
    document.getElementById('statusTitle').innerText = "LOADING";
    document.getElementById('statusMsg').innerText = "Please wait while we set things up...";
    document.getElementById('loadingSpinner').style.display = 'block';
    document.getElementById('successIcon').style.display = 'none';
    document.getElementById('overlayActions').style.display = 'none';
    o.style.display = 'flex';
  }
}
function stopStartupOverlay_() {
  const o = document.getElementById('overlay'); if(o) o.style.display = 'none';
}

window.onload = function() { loadAppConfig(); };

/**
 * Ermittelt, welcher Tab nach dem Laden/Wechseln der Config (normaler Login
 * ODER Admin-Simulation) angezeigt werden soll. Zentral an einer Stelle,
 * damit toggleImpersonation() (AdminScript.html) nicht denselben Chain
 * dupliziert und dabei aus dem Takt geraet (siehe: Simulation landete auf
 * dem zuletzt aktiven Admin-Tab statt auf dem fuer den Ziel-User passenden).
 */
function computeStartTab_(config) {
  let startTab = 'request';
  if (config.isExclusive) {
    if (config.isMarketing) startTab = 'marketing';
    else if (config.isKeC) startTab = 'kec';
    else if (config.isDoc) startTab = 'documentation';
    else if (config.isWoma) startTab = 'woma';
    else if (config.isCc) startTab = 'cc';
    else if (config.isArticulate) startTab = 'articulate';
  }
  return startTab;
}

function loadAppConfig() {
  startStartupOverlay_();
  try {
    google.script.run
      .withSuccessHandler((config) => {
        stopStartupOverlay_();

        // fr/es/pt/zh liegen serverseitig und kommen mit der Config mit.
        // Schlaegt das fehl, faellt die Oberflaeche geschlossen auf Englisch
        // zurueck - sonst wuerden die direkten i18n[currentLang][...]-Zugriffe
        // weiter unten auf undefined laufen.
        if (config && config.i18nEn) i18n.en = config.i18nEn;
        if (config && config.i18nLang && config.i18nDict) i18n[config.i18nLang] = config.i18nDict;
        if (!i18n[currentLang]) currentLang = 'en';

        if (config && (config.authorized === false || config.unauthorized)) {
            document.getElementById('accessDeniedLock').style.display = 'flex';
            return;
        }

        initForm(config);
        initPersonal_(config);

        let startTab = startTabWithHome_(computeStartTab_(config));
        if (!currentImpersonationEmail) {
          google.script.url.getLocation(function(loc) {
            if (loc.parameter && loc.parameter.tab === 'history') switchTab('history');
            else switchTab(startTab);
          });
        } else {
          switchTab(startTab);
        }
        
        setGlobalLang(currentLang);
        setTimeout(function() { checkAndShowChatWelcome(); }, 1500);
        
      })
      .withFailureHandler((err) => {
        stopStartupOverlay_();
        const msg = (err && err.message ? err.message : String(err)).toLowerCase();
        if (msg.includes("not authorized") || msg.includes("access denied") || msg.includes("whitelist")) {
            document.getElementById('accessDeniedLock').style.display = 'flex';
        } else {
            showCustomAlert("Initialization Error: " + (err && err.message ? err.message : err), "Error");
        }
      })
      .apiGetConfig(currentImpersonationEmail, currentLang);
  } catch(e) {
    stopStartupOverlay_();
    showCustomAlert("Startup Error: " + e.message, "Error");
  }
}

// --- CHAT WELCOME POPUP -------------------------------------------------------
function checkAndShowChatWelcome() {
  if (currentImpersonationEmail) return;

  google.script.run
    .withSuccessHandler(function(res) {
      console.log('chatPref result:', JSON.stringify(res));
      console.log('dismissed:', localStorage.getItem('chatWelcomeDismissed'));
      if (!res.enabled && localStorage.getItem('chatWelcomeDismissed') !== 'true') {
        document.getElementById('chatWelcomeModal').style.display = 'flex';
      }
    })
    .withFailureHandler(function(err) {
      console.log('chatPref ERROR:', err.message);
    })
    .apiGetChatPreference();
}

function closeChatWelcome(openSettings) {
  document.getElementById('chatWelcomeModal').style.display = 'none';
  if (document.getElementById('chatWelcomeDontShow').checked) {
    localStorage.setItem('chatWelcomeDismissed', 'true');
  }
  if (openSettings) {
    openPreferences();
  }
}

function openChatHelpManually() {
  document.getElementById('preferencesModal').style.display = 'none';
  document.getElementById('chatWelcomeModal').style.display = 'flex';
}</script>
