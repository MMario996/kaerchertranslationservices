<script>
// Admin-Only JavaScript, ausgelagert aus Index.html. Wird von
// loadAdminContent_() als Script-Element injiziert, nachdem das Admin-Markup
// im DOM ist. Laeuft im globalen Scope und sieht damit die in Index.html
// deklarierten Globals (configData, _tmplMgrRows, MSG_KEY_LABELS, ...).
function loadDocDriveRootSettings() {
  google.script.run
    .withSuccessHandler(res => {
      if (!res.success) return;
      document.getElementById('docDriveRootInput').value = res.folderId || '';
      document.getElementById('docDriveRootCurrentName').innerText = res.folderName ? ('Aktuell: ' + res.folderName) : 'Noch nicht konfiguriert.';
    })
    .apiGetDocDriveRootSettings();
}
function toggleDocDriveRootLock() {
  if (docDriveRootUnlocked) {
    docDriveRootUnlocked = false;
    document.getElementById('docDriveRootInput').disabled = true;
    document.getElementById('docDriveRootSaveBtn').disabled = true;
    document.getElementById('docDriveRootLockIcon').innerText = 'lock';
    document.getElementById('docDriveRootLockText').innerText = 'Locked \u2013 Click to unlock';
    loadDocDriveRootSettings();
    return;
  }
  showCustomConfirm(
    "Dieser Ordner steuert, wo Documentation Import/Export nach Projektordnern suchen. Wirklich entsperren?",
    function() {
      docDriveRootUnlocked = true;
      document.getElementById('docDriveRootInput').disabled = false;
      document.getElementById('docDriveRootSaveBtn').disabled = false;
      document.getElementById('docDriveRootLockIcon').innerText = 'lock_open';
      document.getElementById('docDriveRootLockText').innerText = 'Unlocked \u2013 Click to lock';
    },
    "Entsperren bestätigen"
  );
}
function saveDocDriveRootSettings_() {
  const val = document.getElementById('docDriveRootInput').value.trim();
  if (!val) { showCustomAlert("Bitte Ordner-Link oder -ID eingeben.", "Fehlende Angabe"); return; }
  const btn = document.getElementById('docDriveRootSaveBtn');
  btn.disabled = true; btn.innerText = 'Speichere...';
  google.script.run
    .withSuccessHandler(res => {
      btn.innerText = 'SPEICHERN';
      if (!res.success) { btn.disabled = false; showCustomAlert("Fehler: " + res.error, "Error"); return; }
      showCustomAlert("\u2713 Drive-Root gespeichert: " + res.folderName, "Gespeichert");
      toggleDocDriveRootLock();
    })
    .withFailureHandler(e => {
      btn.disabled = false;
      btn.innerText = 'SPEICHERN';
      showCustomAlert("Fehler: " + e.message, "Error");
    })
    .apiSaveDocDriveRootSettings(val);
}
function toggleAdminHelp(id) {
  const panel = document.getElementById('help-' + id);
  if (panel) panel.classList.toggle('open');
}
    function loadMessageTemplates() {
      const container = document.getElementById('msgTemplatesContainer');
      if (!container) return;
      container.innerHTML = '<div style="padding:20px;text-align:center;color:#888;"><div class="loader" style="width:25px;height:25px;border-width:3px;margin:0 auto 10px;"></div>Loading...</div>';
      
      google.script.run
        .withSuccessHandler(res => {
          if (!res.success || !res.templates) {
            container.innerHTML = '<div style="padding:15px;color:#d93025;">Error loading templates.</div>';
            return;
          }
          let html = '';
          res.templates.forEach(t => {
            const label = MSG_KEY_LABELS[t.key] || t.key;
            const customBadge = t.isCustomized
              ? '<span style="background:#e8f5e9;color:#2e7d32;font-size:9px;padding:1px 6px;border-radius:2px;font-weight:700;margin-left:8px;">CUSTOM</span>'
              : '<span style="background:#f5f5f5;color:#888;font-size:9px;padding:1px 6px;border-radius:2px;margin-left:8px;">DEFAULT</span>';
            
            html += `
            <div style="border:1px solid #eee;margin-bottom:12px;background:#fafafa;">
              <div style="padding:10px 14px;background:#f0f0f0;display:flex;justify-content:space-between;align-items:center;">
                <strong style="font-size:12px;text-transform:uppercase;">${escapeHtml(label)}</strong>
                <div style="display:flex;align-items:center;gap:8px;">
                  ${customBadge}
                  <button onclick="resetMessageTemplate('${escapeJs(t.key)}')"
                          style="background:none;border:1px solid #ddd;cursor:pointer;padding:3px 10px;font-size:11px;color:#888;border-radius:2px;"
                          title="Reset to default">\u2022 Reset</button>
                  <button onclick="saveMessageTemplateFromUI('${escapeJs(t.key)}')"
                          style="background:var(--primary-yellow);border:none;cursor:pointer;padding:3px 12px;font-size:11px;font-weight:700;border-radius:2px;">Save</button>
                </div>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:0;">
                <div style="padding:10px;border-right:1px solid #eee;">
                  <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#888;margin-bottom:6px;">DE</div>
                  <textarea id="msgTpl_de_${escapeHtmlId(t.key)}" rows="6"
                            style="width:100%;box-sizing:border-box;font-size:11px;font-family:monospace;padding:8px;border:1px solid #ddd;resize:vertical;background:#fff;">${escapeHtml(t.de)}</textarea>
                </div>
                <div style="padding:10px;">
                  <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#888;margin-bottom:6px;">EN</div>
                  <textarea id="msgTpl_en_${escapeHtmlId(t.key)}" rows="6"
                            style="width:100%;box-sizing:border-box;font-size:11px;font-family:monospace;padding:8px;border:1px solid #ddd;resize:vertical;background:#fff;">${escapeHtml(t.en)}</textarea>
                </div>
              </div>
            </div>`;
          });
          container.innerHTML = html || '<div style="padding:15px;color:#888;">No templates found.</div>';
        })
        .withFailureHandler(err => {
          if (container) container.innerHTML = '<div style="padding:15px;color:#d93025;">Error: ' + escapeHtml(err.message) + '</div>';
        })
        .apiGetMessageTemplates();
    }
    function saveMessageTemplateFromUI(key) {
      const deEl = document.getElementById('msgTpl_de_' + escapeHtmlId(key));
      const enEl = document.getElementById('msgTpl_en_' + escapeHtmlId(key));
      if (!deEl || !enEl) return;
      google.script.run
        .withSuccessHandler(r => {
          if (r.success) showCustomAlert("\u2713 Template saved!", "Saved");
          else showCustomAlert("\u2717 " + r.error, "Error");
          loadMessageTemplates();
        })
        .withFailureHandler(e => showCustomAlert("Error: " + e.message, "Error"))
        .apiSaveMessageTemplate(key, deEl.value, enEl.value);
    }
    function resetMessageTemplate(key) {
      showCustomConfirm('Reset "' + (MSG_KEY_LABELS[key] || key) + '" to default?', function() {
        google.script.run
          .withSuccessHandler(() => { showCustomAlert("\u2713 Reset to default.", "Reset"); loadMessageTemplates(); })
          .withFailureHandler(e => showCustomAlert("Error: " + e.message, "Error"))
          .apiResetMessageTemplate(key);
      }, "Reset Template");
    }
    function loadKecEligSettings() {
      google.script.run
        .withSuccessHandler(res => {
          document.getElementById('kecClientIdInput').value = res.clientId || '';
          document.getElementById('kecDomainIdInput').value = res.domainId || '';
          document.getElementById('kecBuIdInput').value      = res.businessUnitId || '';
        })
        .withFailureHandler(e => {
          console.warn('KeC Eligibility Settings laden fehlgeschlagen:', e.message);
        })
        .apiGetKecEligibilitySettings();
    }
    function toggleKecEligLock() {
      if (kecEligUnlocked) {
        // Wieder sperren
        kecEligUnlocked = false;
        document.getElementById('kecClientIdInput').disabled = true;
        document.getElementById('kecDomainIdInput').disabled = true;
        document.getElementById('kecBuIdInput').disabled = true;
        document.getElementById('kecEligSaveBtn').disabled = true;
        document.getElementById('kecEligLockIcon').innerText = 'lock';
        document.getElementById('kecEligLockText').innerText = 'Locked \u2013 Click to unlock';
        loadKecEligSettings(); // Änderungen ohne Speichern verwerfen
        return;
      }

      showCustomConfirm(
        "Diese Werte steuern, welche Phrase-Projekte im KeC-Portal erscheinen. Falsche IDs können dazu führen, dass keine Projekte mehr gefunden werden.\n\nWirklich entsperren?",
        function() {
          kecEligUnlocked = true;
          document.getElementById('kecClientIdInput').disabled = false;
          document.getElementById('kecDomainIdInput').disabled = false;
          document.getElementById('kecBuIdInput').disabled = false;
          document.getElementById('kecEligSaveBtn').disabled = false;
          document.getElementById('kecEligLockIcon').innerText = 'lock_open';
          document.getElementById('kecEligLockText').innerText = 'Unlocked \u2013 Click to lock';
        },
        "Entsperren bestätigen"
      );
    }
    function saveKecEligSettings() {
      const clientId = document.getElementById('kecClientIdInput').value.trim();
      const domainId = document.getElementById('kecDomainIdInput').value.trim();
      const buId     = document.getElementById('kecBuIdInput').value.trim();

      if (!clientId || !domainId || !buId) {
        showCustomAlert("Bitte alle drei Felder ausfüllen.", "Fehlende Angaben");
        return;
      }

      const btn = document.getElementById('kecEligSaveBtn');
      btn.disabled = true;
      btn.innerText = 'Speichere...';

      google.script.run
        .withSuccessHandler(() => {
          btn.innerText = 'SPEICHERN';
          showCustomAlert("\u2713 KeC Eligibility Settings gespeichert.", "Gespeichert");
          toggleKecEligLock(); // wieder sperren
        })
        .withFailureHandler(e => {
          btn.disabled = false;
          btn.innerText = 'SPEICHERN';
          showCustomAlert("Fehler: " + e.message, "Error");
        })
        .apiSaveKecEligibilitySettings(clientId, domainId, buId);
    }
    const ADMIN_SUBTABS_ = ['console', 'users', 'templates', 'pivot', 'tests'];
    function applyAdminAccessRestrictions_() {
      const isFullAdmin = !!(configData && configData.isAdmin);
      const allowed = isFullAdmin ? ADMIN_SUBTABS_ : (_adminLightSubtabs_ || []).filter(n => ADMIN_SUBTABS_.includes(n));
      ADMIN_SUBTABS_.forEach(n => {
        const btn = document.getElementById('subtab-btn-' + n);
        if (btn) btn.style.display = allowed.includes(n) ? 'inline-flex' : 'none';
      });
      const first = allowed[0];
      if (!first) return;
      switchAdminSubtab(first);
      if (first === 'console' && isFullAdmin) loadAdminDashboardData();
    }
    function switchAdminSubtab(name) {
      const isFullAdmin = !!(configData && configData.isAdmin);
      const allowed = isFullAdmin ? ADMIN_SUBTABS_ : (_adminLightSubtabs_ || []);
      if (!allowed.includes(name)) return;
      ADMIN_SUBTABS_.forEach(n => {
        const pane = document.getElementById('admin-subtab-' + n);
        const btn  = document.getElementById('subtab-btn-' + n);
        const on = (n === name);
        if (pane) pane.style.display = on ? 'block' : 'none';
        if (btn) {
          btn.style.color = on ? '#d93025' : '#999';
          btn.style.borderBottomColor = on ? '#d93025' : 'transparent';
        }
      });
      if (name === 'templates') loadTemplateManager();
      if (name === 'users') loadUserManager();
      if (name === 'pivot') {
        loadPivotAdminContent_(function () {
          pvInit_();
        });
      }
    }
    function loadTemplateManager() {
      document.getElementById('tmplMgrLoading').style.display = 'block';
      document.getElementById('tmplMgrTable').style.display = 'none';
      document.getElementById('tmplMgrEmpty').style.display = 'none';
      google.script.run
        .withSuccessHandler(res => {
          document.getElementById('tmplMgrLoading').style.display = 'none';
          _tmplMgrRows = (res && res.rows) || [];
          _tmplMgrSelected = {};
          renderTemplateManager();
        })
        .withFailureHandler(e => {
          document.getElementById('tmplMgrLoading').style.display = 'none';
          showCustomAlert('Error: ' + e.message, 'Error');
        })
        .apiGetTemplatesForManager();
    }
    function tmplMgrSyncFromPhrase() {
      const overlay = document.getElementById('downloadOverlay');
      document.getElementById('downloadOverlayTitle').innerText = 'Hole Templates aus Phrase...';
      overlay.style.display = 'flex';
      google.script.run
        .withSuccessHandler(r => {
          overlay.style.display = 'none';
          showCustomAlert(r.msg || 'Sync fertig.', 'Sync');
          loadTemplateManager();
        })
        .withFailureHandler(e => { overlay.style.display = 'none'; showCustomAlert('Error: ' + e.message, 'Error'); })
        .apiTriggerManualSync('templates', 'add_only');
    }
    function _tmplMgrFiltered() {
      const q = (document.getElementById('tmplMgrSearch').value || '').toLowerCase();
      const activeSel = document.getElementById('tf_active') ? document.getElementById('tf_active').value : '';
      const segQ = (document.getElementById('tf_segmentation') ? document.getElementById('tf_segmentation').value : '').toLowerCase().trim();
      const colFilters = {};
      document.querySelectorAll('.tf-col').forEach(el => {
        const v = (el.value || '').toLowerCase().trim();
        if (v) colFilters[el.dataset.field] = v;
      });
      return _tmplMgrRows.filter(r => {
        if (q && !(r.displayName+' '+r.phraseName+' '+r.client+' '+r.domain+' '+r.subDomain+' '+r.businessUnit+' '+r.targetLangs+' '+r.sourceLang).toLowerCase().includes(q)) return false;
        if (activeSel === 'yes' && !r.active) return false;
        if (activeSel === 'no' && r.active) return false;
        if (segQ && !(r.client+' '+r.domain+' '+r.subDomain+' '+r.businessUnit).toLowerCase().includes(segQ)) return false;
        for (const f in colFilters) {
          if (!String(r[f] || '').toLowerCase().includes(colFilters[f])) return false;
        }
        return true;
      });
    }
    function tmplMgrSortBy(field) {
      _tmplMgrSort.dir = (_tmplMgrSort.field === field && _tmplMgrSort.dir === 'asc') ? 'desc' : 'asc';
      _tmplMgrSort.field = field;
      renderTemplateManager();
    }
    function tmplMgrTruncateTargets_(targetLangs) {
      const parts = String(targetLangs || '').split(',').map(s => s.trim()).filter(Boolean);
      if (parts.length <= 5) return escapeHtml(parts.join(', '));
      const shown = parts.slice(0, 5).join(', ');
      const rest = parts.slice(5);
      return escapeHtml(shown) + ' <span class="doc-board-badge-more" style="margin-left:4px;" title="' + escapeHtml(rest.join(', ')) + '">+' + rest.length + '</span>';
    }
    function renderTemplateManager() {
      let rows = _tmplMgrFiltered();
      if (_tmplMgrSort.field) {
        const f = _tmplMgrSort.field, dir = _tmplMgrSort.dir === 'asc' ? 1 : -1;
        rows = rows.slice().sort((a, b) => String(a[f] || '').localeCompare(String(b[f] || '')) * dir);
      }
      const tbody = document.querySelector('#tmplMgrTable tbody');
      const table = document.getElementById('tmplMgrTable');
      const empty = document.getElementById('tmplMgrEmpty');
      if (!rows.length) { table.style.display='none'; empty.style.display='block'; _tmplMgrUpdateBatchBar(); return; }
      table.style.display='table'; empty.style.display='none';
      tbody.innerHTML = rows.map(r => {
        const segSummary = [r.client, r.domain, r.subDomain, r.businessUnit].filter(Boolean).join(' \u2013 ') || '\u2013';
        return `
        <tr data-uid="${escapeHtml(r.uid)}" style="${_tmplMgrSelected[r.uid] ? 'background:#fffde7;' : ''}">
          <td style="text-align:center;">
            <input type="checkbox" ${_tmplMgrSelected[r.uid]?'checked':''} onchange="tmplMgrToggleOne('${escapeJs(r.uid)}', this.checked)">
          </td>
          <td style="text-align:center;">
            <label style="position:relative;display:inline-block;width:40px;height:22px;cursor:pointer;">
              <input type="checkbox" ${r.active ? 'checked' : ''} onchange="toggleTemplateActive('${escapeJs(r.uid)}', this)" style="opacity:0;width:0;height:0;">
              <span style="position:absolute;inset:0;background:${r.active?'#4CAF50':'#ccc'};border-radius:22px;transition:.2s;"></span>
              <span style="position:absolute;height:16px;width:16px;left:${r.active?'21px':'3px'};top:3px;background:#fff;border-radius:50%;transition:.2s;"></span>
            </label>
          </td>
          <td style="white-space:normal;word-break:break-word;"><strong>${escapeHtml(r.displayName)}</strong></td>
          <td style="font-size:12px;color:#666;white-space:normal;word-break:break-word;">${escapeHtml(r.phraseName)}</td>
          <td style="font-size:11px;">${escapeHtml(r.sourceLang)}</td>
          <td style="font-size:11px;line-height:1.6;">${tmplMgrTruncateTargets_(r.targetLangs)}</td>
          <td><span class="truncate-cell" style="font-size:11px;" title="${escapeHtml(segSummary)}">${escapeHtml(segSummary)}</span></td>
        </tr>`;
      }).join('');
      _tmplMgrUpdateBatchBar();
    }
    function toggleTemplateActive(uid, checkboxEl) {
      const newState = checkboxEl.checked;
      checkboxEl.disabled = true;
      google.script.run
        .withSuccessHandler(() => {
          checkboxEl.disabled = false;
          const row = _tmplMgrRows.find(r => r.uid === uid);
          if (row) row.active = newState;
          renderTemplateManager();
        })
        .withFailureHandler(e => {
          checkboxEl.disabled = false;
          checkboxEl.checked = !newState;
          showCustomAlert('Error: ' + e.message, 'Error');
        })
        .apiSetTemplateActive(uid, newState);
    }
    function tmplMgrToggleOne(uid, checked) {
      if (checked) _tmplMgrSelected[uid] = true; else delete _tmplMgrSelected[uid];
      const row = document.querySelector('#tmplMgrTable tbody tr[data-uid="' + CSS.escape(uid) + '"]');
      if (row) row.style.background = checked ? '#fffde7' : '';
      _tmplMgrUpdateBatchBar();
    }
    function tmplMgrToggleAll(masterCb) {
      const rows = _tmplMgrFiltered();
      if (masterCb.checked) rows.forEach(r => { _tmplMgrSelected[r.uid] = true; });
      else rows.forEach(r => { delete _tmplMgrSelected[r.uid]; });
      renderTemplateManager();
    }
    function tmplMgrClearSelection() {
      _tmplMgrSelected = {};
      const master = document.getElementById('tmplMgrSelectAll');
      if (master) master.checked = false;
      renderTemplateManager();
    }
    function _tmplMgrUpdateBatchBar() {
      const count = Object.keys(_tmplMgrSelected).length;
      const bar = document.getElementById('tmplMgrBatchBar');
      document.getElementById('tmplMgrSelCount').innerText = count;
      bar.style.display = count > 0 ? 'flex' : 'none';
    }
    function batchSetTemplateActive(newState) {
      const uids = Object.keys(_tmplMgrSelected);
      if (!uids.length) return;
      showCustomConfirm(uids.length + ' Template(s) auf ' + (newState?'AKTIV':'INAKTIV') + ' setzen?', function() {
        const overlay = document.getElementById('downloadOverlay');
        document.getElementById('downloadOverlayTitle').innerText = 'Aktualisiere ' + uids.length + ' Templates...';
        overlay.style.display = 'flex';
        google.script.run
          .withSuccessHandler(() => {
            overlay.style.display = 'none';
            uids.forEach(uid => { const r = _tmplMgrRows.find(x => x.uid === uid); if (r) r.active = newState; });
            _tmplMgrSelected = {};
            const master = document.getElementById('tmplMgrSelectAll');
            if (master) master.checked = false;
            renderTemplateManager();
          })
          .withFailureHandler(e => { overlay.style.display = 'none'; showCustomAlert('Error: ' + e.message, 'Error'); })
          .apiBatchSetTemplateActive(uids, newState);
      }, 'Batch-Änderung');
    }
    function userMgrToggleExpand(username, group) {
      const key = username + '_' + group;
      if (_userMgrExpanded[key]) delete _userMgrExpanded[key];
      else _userMgrExpanded[key] = true;
      renderUserManager();
    }
    function userMgrDetailField(uid, field, value, label) {
      return '<div class="detail-field"><label>' + label + '</label>' +
        '<input type="text" value="' + escapeHtml(value || '') + '" ' +
        'onblur="userMgrSaveField(\'' + uid + '\',\'' + field + '\',this.value,this)"></div>';
    }
    function loadUserManager() {
      document.getElementById('userMgrLoading').style.display = 'block';
      document.getElementById('userMgrTable').style.display = 'none';
      document.getElementById('userMgrEmpty').style.display = 'none';
      google.script.run
        .withSuccessHandler(res => {
          document.getElementById('userMgrLoading').style.display = 'none';
          _userMgrRows = (res && res.rows) || [];
          renderUserManager();
        })
        .withFailureHandler(e => {
          document.getElementById('userMgrLoading').style.display = 'none';
          showCustomAlert('Error: ' + e.message, 'Error');
        })
        .apiGetUsersForManager();
    }
    function userMgrSortBy(field) {
      _userMgrSort.dir = (_userMgrSort.field === field && _userMgrSort.dir === 'asc') ? 'desc' : 'asc';
      _userMgrSort.field = field;
      renderUserManager();
    }
    function _userMgrFiltered() {
      const searchEl = document.getElementById('userMgrSearch');
      const q = (searchEl ? searchEl.value : '').toLowerCase();
      const roleSel = document.getElementById('um_role_filter') ? document.getElementById('um_role_filter').value : '';
      const colFilters = {};
      document.querySelectorAll('.um-col').forEach(el => {
        const v = (el.value || '').toLowerCase().trim();
        if (v) colFilters[el.dataset.field] = v;
      });
      let rows = _userMgrRows.filter(r => {
        if (q && !Object.values(r).join(' ').toLowerCase().includes(q)) return false;
        if (roleSel && r.role !== roleSel) return false;
        for (const f in colFilters) {
          if (!String(r[f] || '').toLowerCase().includes(colFilters[f])) return false;
        }
        return true;
      });
      if (_userMgrSort.field) {
        const f = _userMgrSort.field, dir = _userMgrSort.dir === 'asc' ? 1 : -1;
        rows = rows.slice().sort((a, b) => String(a[f] || '').localeCompare(String(b[f] || '')) * dir);
      }
      return rows;
    }
    function renderUserManager() {
      const rows = _userMgrFiltered();
      const tbody = document.querySelector('#userMgrTable tbody');
      const table = document.getElementById('userMgrTable');
      const empty = document.getElementById('userMgrEmpty');
      if (!tbody) return;
      if (!rows.length) { table.style.display = 'none'; empty.style.display = 'block'; return; }
      table.style.display = 'table'; empty.style.display = 'none';
      let html = '';
      rows.forEach(r => {
        const uid = escapeJs(r.username);
        const roleOptions = USER_MGR_ROLES.map(role =>
          '<option value="' + role + '"' + (r.role === role ? ' selected' : '') + '>' + role + '</option>'
        ).join('');
        const segSummary = [r.clients, r.domains, r.subdomains, r.businessUnit].filter(Boolean).join(' \u2013 ') || '\u2022 keine Angaben ?';
        const langSummary = [
          r.sourceLangs ? ('Quelle: ' + r.sourceLangs) : '',
          r.targetLangs ? ('Ziel: ' + r.targetLangs) : '',
          r.workflowSteps ? ('Workflow: ' + r.workflowSteps) : ''
        ].filter(Boolean).join(' \u2013 ') || '\u2022 keine Angaben ?';
        const segKey = r.username + '_seg';
        const langKey = r.username + '_lang';
        const segOpen = !!_userMgrExpanded[segKey];
        const langOpen = !!_userMgrExpanded[langKey];

        html += '<tr data-username="' + escapeHtml(r.username) + '">' +
          '<td style="font-size:11px;font-weight:700;">' + escapeHtml(r.username) + '</td>' +
          '<td><input type="text" value="' + escapeHtml(r.firstName || '') + '" onblur="userMgrSaveField(\'' + uid + '\',\'firstName\',this.value,this)" style="width:100%;border:1px solid transparent;background:transparent;font-size:12px;padding:4px;box-sizing:border-box;" onfocus="this.style.border=\'1px solid #ccc\';this.style.background=\'#fff\';"></td>' +
          '<td><input type="text" value="' + escapeHtml(r.lastName || '') + '" onblur="userMgrSaveField(\'' + uid + '\',\'lastName\',this.value,this)" style="width:100%;border:1px solid transparent;background:transparent;font-size:12px;padding:4px;box-sizing:border-box;" onfocus="this.style.border=\'1px solid #ccc\';this.style.background=\'#fff\';"></td>' +
          '<td style="font-size:11px;color:#888;">' + escapeHtml(r.email || '') + '</td>' +

    function userMgrSaveField(username, field, value, el) {
      const row = _userMgrRows.find(r => r.username === username);
      if (row && row[field] === value) return;
      if (el) el.style.opacity = '0.5';
      const syncToPhrase = !!USER_MGR_PHRASE_SYNC_FIELDS[field];
      google.script.run
        .withSuccessHandler(res => {
          if (el) el.style.opacity = '1';
          if (row) row[field] = value;
          if (res && res.phraseWarning) {
            showCustomAlert('\u26A0 Sheet gespeichert, aber Phrase-Sync fehlgeschlagen:\n' + res.phraseWarning, 'Teilweise gespeichert');
          }
        })
        .withFailureHandler(e => {
          if (el) el.style.opacity = '1';
          showCustomAlert('Error: ' + e.message, 'Error');
        })
        .apiUpdateUserField(username, field, value, syncToPhrase);
    }

            accData_ = res;

            f.innerHTML = '<option value="">' + escapeHtml(tr_('acc_all_areas', 'Alle Bereiche')) + '</option>' +

    function renderAccessMatrix_() {
        if (!accData_) return;
        const q = (document.getElementById('accSearch').value || '').trim().toLowerCase();
        const filter = document.getElementById('accFilter').value;
        const areas = accData_.areas;
        const users = accData_.users.filter(u => {
            if (q && u.email.indexOf(q) < 0) return false;
            if (filter === '__none') return !areas.some(a => u.areas[a]);
            if (filter) return !!u.areas[filter];
            return true;
        });
        const counts = {};
        areas.forEach(a => { counts[a] = accData_.users.filter(u => u.areas[a]).length; });
        document.getElementById('accCount').textContent = '(' + users.length + (users.length !== accData_.users.length ? ' / ' + accData_.users.length : '') + ')';
        document.querySelector('#accTable thead').innerHTML = '<tr><th>' + escapeHtml(tr_('acc_user', 'Nutzer')) + '</th>' +
            areas.map(a => '<th title="' + escapeHtml(accAreaLabel_(a)) + '"><span class="material-icons-outlined">' + (ACC_AREA_ICONS_[a] || 'label') + '</span><div>' + escapeHtml(accAreaLabel_(a)) + '</div><small>' + counts[a] + '</small></th>').join('') +
            '<th>Admin-Light</th></tr>';
        document.querySelector('#accTable tbody').innerHTML = users.slice(0, 400).map(u =>
            '<tr><td class="acc-email">' + escapeHtml(u.email) + (u.email === accData_.me ? ' <span class="acc-me">' + escapeHtml(tr_('acc_you', 'du')) + '</span>' : '') + '</td>' +
            areas.map(a => {
                const lock = a === 'admin' && u.email === accData_.me;
                return '<td class="acc-cell"><input type="checkbox" ' + (u.areas[a] ? 'checked ' : '') + (lock ? 'disabled ' : '') +
                  'aria-label="' + escapeHtml(u.email + ' – ' + accAreaLabel_(a)) + '" onchange="toggleAccess_(\'' + escapeJs(u.email) + '\', \'' + a + '\', this)"></td>';
            }).join('') +
            '<td class="acc-light">' + (u.light || []).map(l => '<span>' + escapeHtml(l) + '</span>').join('') + '</td></tr>'
        ).join('') || '<tr><td colspan="' + (areas.length + 2) + '" style="padding:20px;color:#888;text-align:center;">' + escapeHtml(tr_('acc_none', 'Keine Nutzer gefunden.')) + '</td></tr>';
    }

    function toggleAccess_(email, area, cb) {
        const grant = cb.checked;
        cb.disabled = true;
        google.script.run.withSuccessHandler(res => {
            cb.disabled = false;
            if (!res || !res.success || (res.errors && res.errors.length)) {
                cb.checked = !grant;
                showCustomAlert(escapeHtml(((res && res.errors) || [res && res.error]).join('\n')), 'Error');
                return;
            }
            const u = accData_.users.find(x => x.email === email);
            if (u) { if (grant) u.areas[area] = true; else delete u.areas[area]; }
            showToast_('✓ ' + email + ' – ' + accAreaLabel_(area) + (grant ? ' +' : ' –'), 'ok');
        }).withFailureHandler(err => {
            cb.disabled = false; cb.checked = !grant;
            showCustomAlert(escapeHtml(err.message), 'Error');
        }).apiSetAccessBulk([email], [area], grant);
    }

    function bulkAccess_(grant) {
        const emails = document.getElementById('accAddEmails').value.split(/[\s,;]+/).map(e => e.trim().toLowerCase()).filter(e => e.indexOf('@') > 0);
        const areas = Array.from(document.querySelectorAll('#accAddAreas input:checked')).map(i => i.value);
        if (!emails.length || !areas.length) { showCustomAlert(escapeHtml(tr_('acc_need_input', 'Bitte mindestens eine E-Mail und einen Bereich angeben.')), tr_('pv_error', 'Hinweis')); return; }
        const run = () => {
            setDownloadProgress_(tr_('acc_saving', 'Speichere Zugriffe...'), '');
            google.script.run.withSuccessHandler(res => {
                hideDownloadProgress_();
                if (res.errors && res.errors.length) showCustomAlert('<div class="dl-errors">' + res.errors.map(escapeHtml).join('<br>') + '</div>', 'Info');
                else showToast_('✓ ' + tr_('acc_changed', '{n} Änderung(en) gespeichert').replace('{n}', res.changed), 'ok');
                document.getElementById('accAddEmails').value = '';
                loadAccessMatrix();
            }).withFailureHandler(err => { hideDownloadProgress_(); showCustomAlert(escapeHtml(err.message), 'Error'); })
              .apiSetAccessBulk(emails, areas, grant);
        };
        if (grant) run();
        else showCustomConfirm(tr_('acc_confirm_revoke', 'Zugriff für {n} Nutzer entziehen?').replace('{n}', emails.length), run);
    }

    function annAudienceChange_(cb) {
        const all = document.querySelector('#annAudience input[value="all"]');
        const others = Array.from(document.querySelectorAll('#annAudience input')).filter(i => i.value !== 'all');
        if (cb.value === 'all' && cb.checked) others.forEach(i => { i.checked = false; });
        else if (cb.value !== 'all') all.checked = !others.some(i => i.checked);

    function annFormData_() {
        const iso = id => { const v = document.getElementById(id).value; return v ? new Date(v).toISOString() : ''; };
        const aud = Array.from(document.querySelectorAll('#annAudience input:checked')).map(i => i.value);
        return {
            id: document.getElementById('annId').value || '',
            type: (document.querySelector('input[name="annType"]:checked') || {}).value || 'info',
            titleDe: document.getElementById('annTitleDe').value, textDe: document.getElementById('annTextDe').value,
            titleEn: document.getElementById('annTitleEn').value, textEn: document.getElementById('annTextEn').value,
            start: iso('annStart'), end: iso('annEnd'),
            audience: aud.indexOf('all') >= 0 || !aud.length ? ['all'] : aud

    function annPreview_() {
        const a = annFormData_();
        const t = annText_(a);
        document.getElementById('annPreview').innerHTML = (t.title || t.text)
            ? '<div class="announce announce-' + a.type + '" style="margin:0;"><span class="material-icons-outlined announce-ico">' + (ANN_ICONS_[a.type] || 'info') + '</span><div class="announce-body">' +
              (t.title ? '<strong>' + escapeHtml(t.title) + '</strong>' : '') + (t.text ? '<span>' + escapeHtml(t.text).replace(/\n/g, '<br>') + '</span>' : '') + '</div></div>'

    function annLocalInput_(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        const p = n => String(n).padStart(2, '0');
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
    }

    function editAnnouncement_(id) {

        document.getElementById('annId').value = a.id;
        document.querySelector('input[name="annType"][value="' + a.type + '"]').checked = true;
        document.getElementById('annTitleDe').value = a.titleDe; document.getElementById('annTextDe').value = a.textDe;
        document.getElementById('annTitleEn').value = a.titleEn; document.getElementById('annTextEn').value = a.textEn;
        document.getElementById('annStart').value = annLocalInput_(a.start);
        document.getElementById('annEnd').value = annLocalInput_(a.end);
        document.querySelectorAll('#annAudience input').forEach(i => { i.checked = a.audience.indexOf(i.value) >= 0 || (i.value === 'all' && !a.audience.length); });

                <div style="display:flex;gap:5px;justify-content:center;">
                  ${isSens ? `<button onclick="revealScriptProperty('${escapeJs(p.key)}')" title="Reveal" style="background:none;border:1px solid #ccc;cursor:pointer;padding:4px;border-radius:2px;"><i class="material-icons-outlined" style="font-size:14px;color:#555;">visibility</i></button>` : ''}

                  ${!isProt ? `<button onclick="deleteScriptProperty('${escapeJs(p.key)}')" title="Delete" style="background:none;border:1px solid #d93025;cursor:pointer;padding:4px;border-radius:2px;"><i class="material-icons-outlined" style="font-size:14px;color:#d93025;">delete</i></button>` : ''}
                </div>

}
function renderWatcherConfig() {
  const container = document.getElementById('watcherConfigContainer');
  if (!container) return;

  if (!_watcherConfig.length) {
    container.innerHTML = '<div style="padding:15px;color:#888;font-style:italic;">No watchers configured yet.</div>';
    return;
  }

  let html = '';
  _watcherConfig.forEach((entry, idx) => {
    html += `
    <div style="border:1px solid #eee;padding:10px 14px;margin-bottom:8px;background:#fafafa;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
      <div style="flex:1;">
        <div style="font-weight:700;font-size:13px;color:#333;">${escapeHtml(entry.email)}</div>
        <div style="font-size:11px;color:#888;margin-top:3px;">Templates: ${(entry.templates || []).map(t => escapeHtml(t)).join(', ')}</div>
      </div>
      <span class="material-icons-outlined icon-btn-danger" onclick="removeWatcher(${idx})" title="Remove">delete</span>
    </div>`;
  });
  container.innerHTML = html;
}
function addWatcher() {
  const email = document.getElementById('newWatcherEmail').value.trim();
  const templatesRaw = document.getElementById('newWatcherTemplates').value.trim();

  if (!email || !email.includes('@')) { showCustomAlert('Bitte eine gültige E-Mail eingeben.'); return; }
  if (!templatesRaw) { showCustomAlert('Bitte mindestens ein Template angeben.'); return; }

  const templates = templatesRaw.split(',').map(t => t.trim()).filter(Boolean);

  // FIX: Aktuelle Config vom Server laden, dann ergänzen und speichern
  google.script.run
    .withSuccessHandler(res => {
      const currentConfig = res.config || [];
      currentConfig.push({ email, templates });

      google.script.run
        .withSuccessHandler(() => {
          _watcherConfig = currentConfig;
          document.getElementById('newWatcherEmail').value = '';
          document.getElementById('newWatcherTemplates').value = '';
          showCustomAlert('\u2713 Watcher hinzugefügt.', 'Gespeichert');
          renderWatcherConfig();
        })
        .withFailureHandler(e => showCustomAlert('Error: ' + e.message, 'Error'))
        .apiSaveWatcherConfig(currentConfig);
    })
    .withFailureHandler(e => showCustomAlert('Error: ' + e.message, 'Error'))
    .apiGetWatcherConfig();
}
function removeWatcher(idx) {
  showCustomConfirm('Watcher "' + _watcherConfig[idx].email + '" entfernen?', function() {
    _watcherConfig.splice(idx, 1);
    google.script.run
      .withSuccessHandler(() => { showCustomAlert('\u2713 Watcher entfernt.'); renderWatcherConfig(); })
      .withFailureHandler(e => showCustomAlert('Error: ' + e.message, 'Error'))
      .apiSaveWatcherConfig(_watcherConfig);
  });
}
</script>
