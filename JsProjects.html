<script>
// JsProjects.html - eingebunden in Index.html via include() (WebApp.gs)

function loadMyProjects() {
  const t=document.querySelector('#projectsTable tbody'); t.innerHTML='';
  document.getElementById('historyLoading').style.display='block'; document.getElementById('noProjectsMsg').style.display='none';
  google.script.run.withSuccessHandler(r=>{
    document.getElementById('historyLoading').style.display='none';
    if(r.error){document.getElementById('noProjectsMsg').innerHTML=`Error: ${r.error}`;document.getElementById('noProjectsMsg').style.display='block';return;}
    globalProjects=r.projects||r;
    if(!globalProjects.length){document.getElementById('noProjectsMsg').innerHTML=escapeHtml(tr_('hs_empty', 'No projects found.'));document.getElementById('noProjectsMsg').style.display='block';return;}
    fillTable(globalProjects);
    if (currentHistoryView === 'calendar') renderCalendar(globalProjects);
  }).withFailureHandler(e=>{
    document.getElementById('historyLoading').style.display='none';
    document.getElementById('noProjectsMsg').innerHTML=`Error: ${e.message}`;document.getElementById('noProjectsMsg').style.display='block';
  })[historyScope_ === 'doc' ? 'apiGetDocProjectsForHistory' : 'apiGetMyProjects']();
}

function fillTable(projects) {
  const t=document.querySelector('#projectsTable tbody'); t.innerHTML='';
  if(!projects.length){t.innerHTML=('<tr><td colspan="10" style="text-align:center;padding:15px;">' + tr_('jx_2fdbcf0', 'No records.') + '</td></tr>');return;}

  // Pivot (Job-based-Trigger) Parent-Child-Projekte: das Child bekommt eine
  // eigene Queue-Zeile (fuer Status/Download), soll aber nicht als
  // eigenstaendige Zeile in der Liste auftauchen, sondern im aufklappbaren
  // Container seines Parent-Projekts.
  const childByParentUid = {};
  projects.forEach(p => { if (p.pivotRole==='CHILD' && p.pivotLink) childByParentUid[p.pivotLink]=p; });
  const inView = projects.filter(p => p.pivotRole !== 'CHILD' && isArchived_(p) === historyShowArchive_);
  renderStatusChips_(inView);
  const topLevel = inView.filter(p => historyStatusFilter_ === 'all' || statusGroup_(p.status) === historyStatusFilter_);

  if(!topLevel.length){t.innerHTML=`<tr class="empty-row"><td colspan="10"><div class="empty-state"><span class="material-icons-outlined">${historyShowArchive_?'inventory_2':'search_off'}</span><div>${escapeHtml(t_i18n_(currentLang, historyShowArchive_?'hs_empty_archive':'hs_empty'))}</div></div></td></tr>`;return;}

  topLevel.forEach(p=>{
    const tr=document.createElement('tr');
    tr.className = 'row-' + statusGroup_(p.status);
    let due=p.dueDate?`<span class="${dueClass_(p)}">${new Date(p.dueDate).toLocaleDateString()}</span>`:"-";
    let shText=p.isShared?(p.owner===configData.currentUser
      ?`<span style="font-size:10px;background:#f0f0f0;padding:2px 4px;">${tr_('jx_b1a6757', 'Shared with')}<br>${p.sharedWith}</span>`
      :`<span style="font-size:10px;background:#e3f2fd;color:#0d47a1;padding:2px 4px;">${tr_('jx_17414ca', 'Shared by')}<br>${p.owner}</span>`
    ):(p.groupShared
      ?`<span style="font-size:10px;background:#fff8e1;color:#8a6d00;padding:2px 4px;">${tr_('jx_2af27f5', 'WOMA Team')}<br>${p.owner}</span>`
      :"-");

    const cnlBtn=['CANCELLED','COMPLETED','NOTIFIED','DELIVERED'].includes(p.status)
      ?`<div style="width:36px;display:inline-block;"></div>`
      :`<button class="btn-icon danger" title="Cancel Project" onclick="cancelProject('${p.projectUid}','${p.projectName}')"><span class="material-icons-outlined">delete</span></button>`;

    // Dokumentationsprojekte: Download, sobald mindestens eine Sprache fertig ist.
    const docDone = p.docProject && (p.docJobs || []).some(j => ['COMPLETED','DELIVERED','NOTIFIED'].includes(j.status));
    const dlBtn=(['NOTIFIED','COMPLETED','DELIVERED'].includes(p.status) || docDone)
      ?`<button class="btn-download" title="Download / Save to Drive" onclick="openSaveToDriveModal('${p.projectUid}')"><span class="material-icons-outlined">download</span><span class="btn-download-label">${tr_('jx_801ab24', 'Download')}</span></button>`
      :'-';

    const isPivotParent = p.pivotRole === 'PARENT';
    const pivotChild = isPivotParent ? childByParentUid[p.projectUid] : null;
    const pivotGroupId = isPivotParent ? 'pivotGroup_' + String(p.projectUid).replace(/[^a-zA-Z0-9]/g,'') : '';
    const nameCell = isPivotParent
      ? `<span class="pivot-toggle" onclick="togglePivotGroup('${pivotGroupId}')" style="cursor:pointer;display:inline-flex;align-items:center;gap:4px;" title="Parent-Child project – click to expand">
           <span class="material-icons-outlined pivot-caret" style="font-size:16px;transition:transform .15s;">chevron_right</span>
           <span class="material-icons-outlined" style="font-size:15px;color:#888;">account_tree</span>
           <strong>${p.projectName}</strong>
         </span>`
      : `<button type="button" class="project-name-link" onclick="openProjectDetail_('${escapeJs(p.projectUid)}')">${escapeHtml(p.projectName)}</button>`;

    tr.innerHTML=`<td>${nameCell}</td>
      <td><a href="${p.phraseUrl}" target="_blank" style="font-size:11px;" title="Open in Phrase TMS">${p.projectUid} <span class="material-icons-outlined" style="font-size:12px">open_in_new</span></a></td>
      <td style="font-size:11px;">${p.uploadDate||"-"}</td><td>${p.sourceLang}</td>
      <td>${p.docProject ? docJobBadges_(p) : `<span style="font-size:11px;">${p.targetLang||"-"}</span>`}</td>
      <td><span class="status-badge status-${p.status}">${p.status}</span></td>
      <td>${due}</td><td>${shText}</td>
      <td style="text-align:center;">${dlBtn}</td>
      <td style="text-align:center">
         <button class="btn-icon" onclick="openProjectDetail_('${escapeJs(p.projectUid)}')" title="${escapeHtml(tr_('pd_details', 'Details'))}"><span class="material-icons-outlined">info</span></button>
         <button class="btn-icon" onclick="showTimeline('${p.projectUid}')" title="Timeline & Status"><span class="material-icons-outlined">timeline</span></button>
         ${p.docProject ? `
         <button class="btn-icon" onclick="openJobNoteModal('${p.projectUid}')" title="Notes"><span class="material-icons-outlined">edit_note</span></button>
         <button class="btn-icon" onclick="docArchiveFromHistory_('${escapeJs(p.projectUid)}','${escapeJs(p.projectName)}')" title="${escapeHtml(tr_('pd_archive', 'Archive'))}"><span class="material-icons-outlined">archive</span></button>` : `
         <button class="btn-icon" onclick="shareProject('${p.projectUid}')" title="Share with Colleague"><span class="material-icons-outlined">share</span></button>
         <button class="btn-icon" onclick="cloneProject('${p.projectUid}')" title="Clone / Duplicate Project"><span class="material-icons-outlined">content_copy</span></button>
         <button class="btn-icon" onclick="openJobNoteModal('${p.projectUid}')" title="Notes"><span class="material-icons-outlined">edit_note</span></button>
         ${['CANCELLED','COMPLETED','NOTIFIED','DELIVERED'].includes(p.status) ? '<div style="width:36px;display:inline-block;"></div>' : `<button class="btn-icon" onclick="openDueDateModal('${p.projectUid}','${p.projectName}','${p.dueDate||''}')" title="Update Due Date"><span class="material-icons-outlined">edit_calendar</span></button>`}
         ${cnlBtn}`}
      </td>`;
    applyMobileLabels_(tr);
    t.appendChild(tr);

    if (isPivotParent) t.appendChild(buildPivotDetailRow_(pivotGroupId, p, pivotChild));
  });
}

// --- Meine Projekte: Status-Chips, Archiv, Fristen, Mobile-Karten ----------
let historyStatusFilter_ = 'all';
let historyShowArchive_ = false;
const HISTORY_COL_KEYS_ = [['th_name',tr_('jx_9e727fd', 'Project')], [null,tr_('jx_b3acfd2', 'Phrase ID')], ['th_uploaded',tr_('jx_fe8d588', 'Uploaded')], ['th_source',tr_('jx_f31bbdd', 'Source')], ['th_targets',tr_('jx_c41a318', 'Target')], ['th_status',tr_('jx_ec53a8c', 'Status')], ['th_due',tr_('jx_d036392', 'Due')], ['th_shared',tr_('jx_a6156ea', 'Shared')], ['dl_btn_download',tr_('jx_801ab24', 'Download')], ['th_actions',tr_('jx_06df330', 'Actions')]];
const ARCHIVE_AFTER_DAYS_ = 30;

function statusGroup_(status) {
  const s = String(status || '').toUpperCase();
  if (['COMPLETED','DELIVERED','NOTIFIED'].includes(s)) return 'done';
  if (['CANCELLED','CANCELED','REJECTED','ERROR'].includes(s)) return 'cancelled';
  return 'open';
}

// Archiv = abgeschlossen/abgebrochen und seit ARCHIVE_AFTER_DAYS_ Tagen ruhig
// (letzter Download, sonst Upload-Datum). Offene Projekte nie im Archiv.
function isArchived_(p) {
  if (statusGroup_(p.status) === 'open') return false;
  const ref = new Date(p.downloadedAt || p.timestamp || p.uploadDate || 0);
  if (isNaN(ref.getTime()) || ref.getTime() === 0) return false;
  return (Date.now() - ref.getTime()) > ARCHIVE_AFTER_DAYS_ * 86400000;
}

function dueClass_(p) {
  if (statusGroup_(p.status) !== 'open' || !p.dueDate) return '';
  const d = new Date(p.dueDate);
  if (isNaN(d.getTime())) return '';
  const hours = (d.getTime() - Date.now()) / 3600000;
  if (hours < 0) return 'due-overdue';
  if (hours < 48) return 'due-soon';
  return '';
}

function applyMobileLabels_(tr) {
  Array.from(tr.children).forEach((td, i) => { const k = HISTORY_COL_KEYS_[i]; if (k) td.setAttribute('data-label', k[0] ? tr_(k[0], k[1]) : k[1]); });
}

function renderStatusChips_(projects) {
  const box = document.getElementById('statusChips');
  if (!box) return;
  const counts = { all: projects.length, open: 0, done: 0, cancelled: 0 };
  projects.forEach(p => counts[statusGroup_(p.status)]++);
  const chip = (key, icon) =>
    `<button type="button" class="status-chip chip-${key}${historyStatusFilter_ === key ? ' active' : ''}" onclick="setHistoryStatusFilter('${key}')">
       <span class="material-icons-outlined">${icon}</span>${escapeHtml(t_i18n_(currentLang, 'hs_' + key))}<span class="chip-count">${counts[key]}</span>
     </button>`;
  box.innerHTML = chip('all', 'apps') + chip('open', 'pending') + chip('done', 'task_alt') + chip('cancelled', 'block')
    + (historyShowArchive_ ? `<span class="archive-hint"><span class="material-icons-outlined">inventory_2</span>${escapeHtml(t_i18n_(currentLang, 'hs_archive_hint'))}</span>` : '');
}

function setHistoryStatusFilter(key) {
  historyStatusFilter_ = key;
  globalSearch();
}

function toggleArchiveView() {
  historyShowArchive_ = !historyShowArchive_;
  const btn = document.getElementById('archiveToggleBtn');
  if (btn) {
    btn.classList.toggle('active', historyShowArchive_);
    btn.innerHTML = historyShowArchive_
      ? '<i class="material-icons-outlined">unarchive</i> <span data-i18n="hs_hide_archive">' + escapeHtml(tr_('hs_hide_archive', 'Hide Archive')) + '</span>'
      : '<i class="material-icons-outlined">archive</i> <span data-i18n="hs_show_archive">' + escapeHtml(tr_('hs_show_archive', 'Show Archive')) + '</span>';
  }
  historyStatusFilter_ = 'all';
  globalSearch();
}

function buildPivotDetailRow_(groupId, parent, child) {
  const tr = document.createElement('tr');
  tr.id = groupId;
  tr.style.display = 'none';
  tr.className = 'pivot-detail-row';

  const step = (label, proj, part) => {
    if (!proj) {
      return `<div style="padding:9px 14px;font-size:12px;color:#888;border-top:1px solid #e8e8e8;">
        <span class="material-icons-outlined" style="font-size:14px;vertical-align:-3px;">hourglass_empty</span>
        <strong>${label}:</strong> will be created automatically once the previous step is done
      </div>`;
    }
    const dlBtn = ['NOTIFIED','COMPLETED','DELIVERED'].includes(proj.status)
      ? `<button class="btn-download" title="Download / Save to Drive" onclick="openSaveToDriveModal('${parent.projectUid}','${part}')"><span class="material-icons-outlined">download</span><span class="btn-download-label">${tr_('jx_801ab24', 'Download')}</span></button>`
      : '';
    return `<div style="padding:9px 14px;font-size:12px;display:flex;align-items:center;gap:10px;border-top:1px solid #e8e8e8;">
      <strong style="min-width:90px;">${label}:</strong>
      <span>${proj.projectName}</span>
      <span class="status-badge status-${proj.status}" style="font-size:10px;">${proj.status}</span>
      <a href="${proj.phraseUrl}" target="_blank" style="font-size:11px;" title="Open in Phrase TMS"><span class="material-icons-outlined" style="font-size:14px;vertical-align:-2px;">open_in_new</span></a>
      <span style="margin-left:auto;">${dlBtn}</span>
    </div>`;
  };

  // Klare optische Abgrenzung zur naechsten Projektzeile: linker Akzentrahmen
  // (Gruppen-Zugehoerigkeit), dickerer unterer Rahmen + Schatten (Abschluss
  // des Containers) statt nur einem duennen Trennstrich.
  tr.innerHTML = `<td colspan="10" style="background:#fafafa;padding:0 0 10px 0;border-left:3px solid var(--primary-yellow,#FFED00);border-bottom:3px solid #ddd;box-shadow:inset 0 -6px 6px -6px rgba(0,0,0,0.08);">
    ${step('Source-Check', parent, 'source')}
    ${step('Translation', child, 'target')}
  </td>`;
  return tr;
}

function togglePivotGroup(groupId) {
  const row = document.getElementById(groupId);
  if (!row) return;
  const expanded = row.style.display !== 'none';
  row.style.display = expanded ? 'none' : '';
  const caret = row.previousElementSibling && row.previousElementSibling.querySelector('.pivot-caret');
  if (caret) caret.style.transform = expanded ? '' : 'rotate(90deg)';
}

function globalSearch() {
  const q = document.getElementById('globalSearchInput').value.toLowerCase();
  const filterVal = document.getElementById('ownershipFilter') ? document.getElementById('ownershipFilter').value : 'all';
  const currentUser = configData.currentUser.toLowerCase();
  
  let filtered = globalProjects;

  if (filterVal === 'own') {
      filtered = filtered.filter(p => p.owner === currentUser);
  } else if (filterVal === 'shared') {
      filtered = filtered.filter(p => p.owner !== currentUser && ((p.sharedWith || '').toLowerCase().includes(currentUser) || p.groupShared));
  }

  if (q) {
      filtered = filtered.filter(p =>
        ['projectName','status','sourceLang','targetLang','uploadDate','projectUid','templateName', 'sharedWith', 'owner', 'iaNumber']
          .some(k => (p[k]||'').toLowerCase().includes(q))
        || (p.dueDate ? new Date(p.dueDate).toLocaleDateString().toLowerCase().includes(q) : false)
      );
  }
  
  fillTable(filtered);
}

function exportProjectsCSV() {
  const headers = [tr_('jx_8e3a421', 'Project Name'),tr_('jx_b3acfd2', 'Phrase ID'),tr_('jx_25e7568', 'Upload Date'),tr_('jx_f31bbdd', 'Source'),tr_('jx_c41a318', 'Target'),tr_('jx_ec53a8c', 'Status'),tr_('jx_14c841e', 'Due Date'),tr_('jx_278c491', 'Template')];
  const rows = globalProjects.map(p => [
    p.projectName, p.projectUid, p.uploadDate, p.sourceLang, p.targetLang,
    p.status, p.dueDate ? new Date(p.dueDate).toLocaleDateString() : '', p.templateName || ''
  ].map(v => `"${(v||'').replace(/"/g,'""')}"`));
  const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
  a.download = 'projects_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

function syncProjectStatuses() {
  const btn = document.getElementById('syncStatusBtn');
  btn.disabled = true; btn.innerHTML = '<i class="material-icons-outlined">sync</i> Syncing...';
  google.script.run
    .withSuccessHandler(r => {
      btn.disabled = false; btn.innerHTML = '<i class="material-icons-outlined">sync</i> Sync Status';
      showCustomAlert(r.success ? `\u2713 ${r.updated} project(s) updated.` : '\u2717 ' + r.message, tr_('jx_aea586b', 'Status Sync'));
      if (r.success && r.updated > 0) loadMyProjects();
    })
    .withFailureHandler(e => {
      btn.disabled = false; btn.innerHTML = '<i class="material-icons-outlined">sync</i> Sync Status';
      showCustomAlert(tr_('jx_3d9f514', 'Error:') + ' ' + e.message, tr_('jx_902b0d5', 'Error'));
    })
    .apiSyncProjectStatuses();
}

let currentHistoryView = 'table';
let calView_ = 'month';
let calCursor_ = null;
function switchHistoryView(mode) {
  currentHistoryView = mode;
  document.getElementById('btnViewTable').style.background    = mode==='table'    ? 'var(--primary-black)' : '#f5f5f5';
  document.getElementById('btnViewTable').style.color         = mode==='table'    ? 'var(--primary-yellow)' : '#666';
  document.getElementById('btnViewCalendar').style.background = mode==='calendar' ? 'var(--primary-black)' : '#f5f5f5';
  document.getElementById('btnViewCalendar').style.color      = mode==='calendar' ? 'var(--primary-yellow)' : '#666';
  document.querySelector('#projectsTable').closest('div[style*="overflow-x"]').style.display = mode==='table' ? '' : 'none';
  document.getElementById('calendarView').style.display = mode==='calendar' ? 'block' : 'none';
  if (mode === 'calendar') {
    if (!calCursor_) calCursor_ = new Date();
    if (window.matchMedia && window.matchMedia('(max-width: 700px)').matches && !calCursor_._touched) calView_ = 'week';
    renderCalendar(globalProjects);
  }
}

// --- Kalender (Monat / Woche) --------------------------------------------------
function calLocale_() {
  return { de: 'de-DE', en: 'en-GB', fr: 'fr-FR', es: 'es-ES', pt: 'pt-BR', zh: 'zh-CN' }[currentLang] || 'en-GB';
}
function calDayKey_(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function calStartOfWeek_(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); // Montag als Wochenstart
  return x;
}
function calProjectsByDay_(projects) {
  const map = {};
  projects.forEach(p => {
    if (!p.dueDate) return;
    const d = new Date(p.dueDate);
    if (isNaN(d.getTime())) return;
    (map[calDayKey_(d)] = map[calDayKey_(d)] || []).push(p);
  });
  Object.keys(map).forEach(k => map[k].sort((a, b) => String(a.projectName).localeCompare(String(b.projectName))));
  return map;
}
function calChipClass_(p) {
  const g = statusGroup_(p.status);
  return g === 'open' && dueClass_(p) === 'due-overdue' ? 'cal-overdue' : 'cal-' + g;
}
function calChipHtml_(p, detailed) {
  const title = escapeHtml(p.projectName) + ' – ' + escapeHtml(p.status || '');
  if (!detailed) {
    return `<button type="button" class="cal-chip ${calChipClass_(p)}" title="${title}" onclick="showTimeline('${escapeJs(p.projectUid)}')">${escapeHtml(p.projectName)}</button>`;
  }
  return `<button type="button" class="cal-card ${calChipClass_(p)}" title="${title}" onclick="showTimeline('${escapeJs(p.projectUid)}')">
      <span class="cal-card-name">${escapeHtml(p.projectName)}</span>
      <span class="cal-card-meta"><span class="status-badge status-${escapeHtml(p.status)}">${escapeHtml(p.status || '-')}</span>
      ${p.targetLang ? `<span class="cal-card-langs">${escapeHtml(p.targetLang)}</span>` : ''}</span>
    </button>`;
}

function renderCalendar(projects) {
  if (!calCursor_) calCursor_ = new Date();
  const loc = calLocale_();
  const grid = document.getElementById('calGrid');
  const byDay = calProjectsByDay_((projects || []).filter(p => p.pivotRole !== 'CHILD'));
  const todayKey = calDayKey_(new Date());
  document.getElementById('calViewMonth').classList.toggle('active', calView_ === 'month');
  document.getElementById('calViewWeek').classList.toggle('active', calView_ === 'week');

  const weekStart = calStartOfWeek_(calView_ === 'month' ? new Date(calCursor_.getFullYear(), calCursor_.getMonth(), 1) : calCursor_);
  const headers = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart); d.setDate(d.getDate() + i);
    headers.push(d.toLocaleDateString(loc, { weekday: calView_ === 'month' ? 'short' : 'long' }));
  }

  let html = '';
  if (calView_ === 'month') {
    document.getElementById('calTitle').innerText = calCursor_.toLocaleDateString(loc, { month: 'long', year: 'numeric' });
    const lastOfMonth = new Date(calCursor_.getFullYear(), calCursor_.getMonth() + 1, 0);
    const end = calStartOfWeek_(lastOfMonth); end.setDate(end.getDate() + 6);
    html += '<div class="cal-grid cal-month">' + headers.map(h => `<div class="cal-head">${escapeHtml(h)}</div>`).join('');
    for (let d = new Date(weekStart); d <= end; d.setDate(d.getDate() + 1)) {
      const key = calDayKey_(d);
      const items = byDay[key] || [];
      const outside = d.getMonth() !== calCursor_.getMonth();
      const shown = items.slice(0, 3);
      const more = items.length - shown.length;
      html += `<div class="cal-cell${outside ? ' cal-outside' : ''}${key === todayKey ? ' cal-is-today' : ''}${items.length ? ' has-items' : ''}" onclick="calOpenWeek('${key}', event)">
          <div class="cal-daynum">${d.getDate()}${items.length ? `<span class="cal-count">${items.length}</span>` : ''}</div>
          ${shown.map(p => calChipHtml_(p, false)).join('')}
          ${more > 0 ? `<button type="button" class="cal-more" onclick="calOpenWeek('${key}', event, true)">+${more} ${escapeHtml(t_i18n_(currentLang, 'cal_more') || 'more')}</button>` : ''}
        </div>`;
    }
    html += '</div>';
  } else {
    const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate() + 6);
    document.getElementById('calTitle').innerText =
      weekStart.toLocaleDateString(loc, { day: 'numeric', month: 'short' }) + ' – ' +
      weekEnd.toLocaleDateString(loc, { day: 'numeric', month: 'short', year: 'numeric' });
    html += '<div class="cal-grid cal-week">';
    for (let i = 0; i < 7; i++) {
      const d = new Date(weekStart); d.setDate(d.getDate() + i);
      const key = calDayKey_(d);
      const items = byDay[key] || [];
      html += `<div class="cal-wday${key === todayKey ? ' cal-is-today' : ''}">
          <div class="cal-wday-head"><span>${escapeHtml(headers[i])}</span><span class="cal-wday-date">${d.toLocaleDateString(loc, { day: 'numeric', month: 'short' })}</span></div>
          <div class="cal-wday-body">${items.length ? items.map(p => calChipHtml_(p, true)).join('') : '<div class="cal-empty">–</div>'}</div>
        </div>`;
    }
    html += '</div>';
  }
  grid.innerHTML = html;
}

function setCalView(view) {
  calView_ = view;
  if (calCursor_) calCursor_._touched = true;
  renderCalendar(globalProjects);
}
function calOpenWeek(key, ev, force) {
  if (ev && !force && ev.target.closest('.cal-chip')) return;
  if (ev) ev.stopPropagation();
  const [y, m, d] = key.split('-').map(Number);
  calCursor_ = new Date(y, m - 1, d);
  calCursor_._touched = true;
  calView_ = 'week';
  renderCalendar(globalProjects);
}
function calShift_(dir) {
  if (!calCursor_) calCursor_ = new Date();
  const c = new Date(calCursor_);
  if (calView_ === 'month') { c.setDate(1); c.setMonth(c.getMonth() + dir); }
  else c.setDate(c.getDate() + 7 * dir);
  c._touched = true;
  calCursor_ = c;
  renderCalendar(globalProjects);
}
function calPrev() { calShift_(-1); }

// Esc schliesst den obersten offenen Dialog. Reihenfolge = Stapelung (oben zuerst).
// Fortschrittsanzeigen (downloadOverlay, Upload-Overlay) bleiben bewusst offen.
const ESC_CLOSERS_ = [
  ['customDialogOverlay', 'closeCustomDialog'],
  ['dueDateModal', 'closeDueDateModal'],
  ['saveToDriveModal', 'closeSaveToDriveModal'],
  ['jobNoteModal', 'closeJobNoteModal'],
  ['projectDrawer', 'closeProjectDetail_'],
  ['timelineModal', 'closeTimeline'],
  ['driveModal', 'closeDriveModal'],
  ['slidesModal', 'closeSlidesModal'],
  ['logsModal', 'closeLogsModal'],
  ['preferencesModal', 'closePreferences'],
  ['articulateTableModal', 'closeArticulateTableModal'],
  ['instructionModal', 'closeInstruction'],
  ['chatWelcomeModal', 'closeChatWelcome']
];
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Escape' || e.defaultPrevented) return;
  for (const [id, fn] of ESC_CLOSERS_) {
    const el = document.getElementById(id);
    if (el && el.style.display && el.style.display !== 'none' && typeof window[fn] === 'function') {
      e.preventDefault();
      window[fn]();
      return;
    }
  }
  // Offene Auswahllisten (Template, Sprachen) schliessen.
  document.querySelectorAll('.tmpl-dropdown-panel.open, .multiselect-options.open').forEach(p => p.classList.remove('open'));
});

// Symbol-Buttons ohne Text bekommen ihren Tooltip als aria-label - auch fuer
// spaeter per innerHTML erzeugte Zeilen (Tabelle, Dialoge).
function applyAriaLabels_(root) {
  (root || document).querySelectorAll('button[title]:not([aria-label]), a[title]:not([aria-label])').forEach(el => {
    if (!el.textContent.replace(/\s+/g, '').length || el.querySelector('.material-icons-outlined') && el.textContent.trim().split(/\s+/).length <= 1) {
      el.setAttribute('aria-label', el.getAttribute('title'));
    }
  });  // Symbol-Ligaturen ("download", "close" ...) nicht vorlesen.
  (root || document).querySelectorAll('.material-icons-outlined:not([aria-hidden]), .material-icons:not([aria-hidden])').forEach(i => i.setAttribute('aria-hidden', 'true'));
}
document.addEventListener('DOMContentLoaded', function() {
  applyAriaLabels_(document);
  let pending = false;
  new MutationObserver(() => {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => { pending = false; applyAriaLabels_(document); });
  }).observe(document.body, { childList: true, subtree: true });
});

function pdStepsHtml_(status) {
  const s = String(status || '').toUpperCase();
  if (statusGroup_(s) === 'cancelled') {
    return `<div class="pd-cancelled"><span class="material-icons-outlined">block</span>${escapeHtml(s)}</div>`;
  }
  let idx = PD_STATUS_ORDER_.indexOf(s === 'NOTIFIED' ? 'DELIVERED' : s === 'QUEUED_UPLOAD' ? 'NEW' : s);
  if (idx === -1) idx = 0;
  return '<ol class="pd-steps">' + PD_STATUS_ORDER_.map((st, i) =>
    `<li class="${i < idx ? 'done' : i === idx ? 'current' : ''}"><span class="pd-dot">${i < idx ? '\u2713' : ''}</span><span>${st}</span></li>`
  ).join('') + '</ol>';
}

function dbxInitControls_() {
  const seg = document.getElementById('dbxRange');
  if (seg.dataset.ready) return;
  seg.dataset.ready = '1';
  try {
    const saved = JSON.parse(localStorage.getItem('dbxRange') || 'null');
    if (saved && saved.range) Object.assign(dbxState_, saved);
  } catch (e) {}
  seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    dbxState_.range = b.dataset.r;
    if (b.dataset.r === 'custom' && !dbxState_.from) {
      const to = new Date(), from = new Date(Date.now() - 30 * 86400000);
      dbxState_.from = from.toISOString().slice(0, 10);
      dbxState_.to = to.toISOString().slice(0, 10);
    }
    dbxSaveRange_();
    dbxRender_();
  }));
  const grid = document.getElementById('dbxGrid');
  const tip = document.getElementById('dbxTip');
  grid.addEventListener('mousemove', e => {
    const t = e.target.closest('[data-tip]');
    if (!t) { tip.style.display = 'none'; return; }
    tip.innerHTML = t.getAttribute('data-tip');
    tip.style.display = 'block';
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - 14;
    if (y + h > window.innerHeight - 8) y = e.clientY - h - 14;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  grid.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  grid.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.getAttribute('data-act'), val = t.getAttribute('data-val') || '';
    if (act === 'bucket') { dbxState_.bucket = val; dbxRender_(); return; }
    if (act === 'metric') { dbxState_.metric = val; dbxRender_(); return; }
    if (act === 'hide') { dbxSetWidget_(val, { show: false }); return; }
    if (act === 'range') {
      const parts = val.split('|');
      dbxState_.range = 'custom'; dbxState_.from = parts[0]; dbxState_.to = parts[1];
      dbxSaveRange_(); dbxRender_(); return;
    }
    if (act === 'open') { dbxOpenProject_(val); return; }
    dbxState_[act] = dbxState_[act] === val ? '' : val;
    dbxRender_();
  });
}

function dbxSaveRange_() {
  try { localStorage.setItem('dbxRange', JSON.stringify({ range: dbxState_.range, from: dbxState_.from, to: dbxState_.to })); } catch (e) {}
}

function dbxSetCustom() {
  dbxState_.range = 'custom';
  dbxState_.from = document.getElementById('dbxFrom').value || null;
  dbxState_.to = document.getElementById('dbxTo').value || null;
  dbxSaveRange_();
  dbxRender_();
}

function dbxSetFilter(key, val) {

  dbxRender_();
}

    rows.forEach(r => [].concat(fn(r)).forEach(k => { if (k) m[k] = (m[k] || 0) + 1; }));

  fill('dbxFLang', tr_('db2_all_langs', 'Alle Sprachen'), count(r => r.langs));

  document.getElementById('dbxFUser').style.display = dbxData_.scope === 'all' ? '' : 'none';
}

/** Aktueller Zeitraum als [fromMs, toMs] (to exklusiv) oder null fuer "Alle". */
function dbxRange_() {
  const now = new Date();
  const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1).getTime();
  const r = dbxState_.range;
  if (r === 'all') return null;
  if (r === 'ytd') return [new Date(now.getFullYear(), 0, 1).getTime(), endOfToday];
  if (r === 'custom') {
    const f = dbxState_.from ? new Date(dbxState_.from + 'T00:00:00').getTime() : -Infinity;
    const t = dbxState_.to ? new Date(dbxState_.to + 'T00:00:00').getTime() + 86400000 : endOfToday;
    return [f, t];
  }
  return [endOfToday - Number(r) * 86400000, endOfToday];
}

function dbxIsOverdue_(r) { return r.grp === 'open' && !isNaN(r.d) && r.d < Date.now(); }

function dbxMatch_(r, skipKey) {
  const s = dbxState_;
  if (skipKey !== 'status' && s.status) {
    if (s.status === 'overdue') { if (!dbxIsOverdue_(r)) return false; }
    else if (r.grp !== s.status) return false;
  }
  if (skipKey !== 'template' && s.template && r.template !== s.template) return false;
  if (skipKey !== 'lang' && s.lang && r.langs.indexOf(s.lang) < 0) return false;
  if (skipKey !== 'user' && s.user && r.owner !== s.user) return false;
  if (s.q) {
    const q = s.q.toLowerCase();
    if ((r.name + ' ' + r.uid + ' ' + r.template + ' ' + r.owner).toLowerCase().indexOf(q) < 0) return false;
  }
  return true;
}

function dbxInRange_(r, range) {
  if (!range) return true;
  return !isNaN(r.t) && r.t >= range[0] && r.t < range[1];
}

function dbxLoadLayout_() {
  if (dbxLayout_) return dbxLayout_;
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(DBX_LAYOUT_KEY_) || '[]') || []; } catch (e) {}
  const byId = {};
  saved.forEach(w => { byId[w.id] = w; });
  const known = DBX_WIDGETS_.map(w => w.id);
  dbxLayout_ = saved.filter(w => known.indexOf(w.id) >= 0);
  DBX_WIDGETS_.forEach(w => { if (!byId[w.id]) dbxLayout_.push({ id: w.id, show: true, size: w.size }); });
  return dbxLayout_;
}

function dbxSaveLayout_() {
  try { localStorage.setItem(DBX_LAYOUT_KEY_, JSON.stringify(dbxLayout_)); } catch (e) {}
}

function dbxSetWidget_(id, patch) {
  const w = dbxLoadLayout_().find(x => x.id === id);
  if (!w) return;
  Object.assign(w, patch);
  dbxSaveLayout_();
  dbxRender_();
}

function dbxResetLayout() {
  dbxLayout_ = null;
  try { localStorage.removeItem(DBX_LAYOUT_KEY_); } catch (e) {}
  dbxRender_();
}

function dbxToggleCustomize() {
  dbxEditing_ = !dbxEditing_;
  document.getElementById('dbxCustomizeBtn').classList.toggle('active', dbxEditing_);
  dbxRender_();
}

function dbxRenderCustomize_() {
  const panel = document.getElementById('dbxCustomizePanel');
  panel.style.display = dbxEditing_ ? 'block' : 'none';
  if (!dbxEditing_) return;
  const layout = dbxLoadLayout_();
  panel.innerHTML = '<h4>' + escapeHtml(tr_('db2_customize_title', 'Dashboard anpassen')) + '</h4>' +
    '<div style="font-size:12px;color:#777;margin-bottom:10px;">' + escapeHtml(tr_('db2_customize_hint', 'Kacheln ein-/ausblenden, per Drag & Drop oder Pfeilen sortieren und die Breite wählen. Die Einstellung wird in diesem Browser gespeichert.')) + '</div>' +
    layout.map((w, i) => {
      const def = DBX_WIDGETS_.find(d => d.id === w.id);
      if (def.scopeAll && dbxData_ && dbxData_.scope !== 'all') return '';
      return '<div class="dbx-cz-row" draggable="true" data-id="' + w.id + '">' +
        '<span class="material-icons-outlined h">drag_indicator</span>' +
        '<label><input type="checkbox" ' + (w.show ? 'checked' : '') + ' ' + 'onchange="dbxSetWidget_(\'' + w.id + '\', {show:this.checked})"> ' + escapeHtml(dbxWTitle_(def)) + '</label>' +
        '<select onchange="dbxSetWidget_(\'' + w.id + '\', {size:Number(this.value)})">' +
          [[1, tr_('db2_size_s', 'Schmal')], [2, tr_('db2_size_m', 'Halb')], [4, tr_('db2_size_l', 'Voll')]].map(o => '<option value="' + o[0] + '"' + (w.size === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') +
        '</select>' +
        '<button type="button" title="' + escapeHtml(tr_('db2_up', 'Nach oben')) + '" onclick="dbxMove_(' + i + ',-1)"><span class="material-icons-outlined">arrow_upward</span></button>' +
        '<button type="button" title="' + escapeHtml(tr_('db2_down', 'Nach unten')) + '" onclick="dbxMove_(' + i + ',1)"><span class="material-icons-outlined">arrow_downward</span></button>' +
      '</div>';
    }).join('') +
    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">' +
      '<button type="button" class="dbx-btn" onclick="dbxResetLayout()"><span class="material-icons-outlined">restart_alt</span>' + escapeHtml(tr_('db2_reset', 'Standard')) + '</button>' +
      '<button type="button" class="dbx-btn active" onclick="dbxToggleCustomize()"><span class="material-icons-outlined">check</span>' + escapeHtml(tr_('db2_done', 'Fertig')) + '</button>' +
    '</div>';
  let dragId = null;
  panel.querySelectorAll('.dbx-cz-row').forEach(row => {
    row.addEventListener('dragstart', () => { dragId = row.dataset.id; row.classList.add('dragging'); });
    row.addEventListener('dragend', () => row.classList.remove('dragging'));
    row.addEventListener('dragover', e => e.preventDefault());
    row.addEventListener('drop', e => {
      e.preventDefault();
      const from = dbxLayout_.findIndex(w => w.id === dragId);
      const to = dbxLayout_.findIndex(w => w.id === row.dataset.id);
      if (from < 0 || to < 0 || from === to) return;
      const item = dbxLayout_.splice(from, 1)[0];
      dbxLayout_.splice(to, 0, item);
      dbxSaveLayout_();
      dbxRender_();
    });
  });
}

function dbxMove_(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= dbxLayout_.length) return;
  const tmp = dbxLayout_[i]; dbxLayout_[i] = dbxLayout_[j]; dbxLayout_[j] = tmp;
  dbxSaveLayout_();
  dbxRender_();
}

function dbxRender_() {
  // Steuerelemente mit dem Zustand abgleichen
  document.querySelectorAll('#dbxRange button').forEach(b => b.classList.toggle('active', b.dataset.r === dbxState_.range));
  document.getElementById('dbxCustomRange').style.display = dbxState_.range === 'custom' ? 'inline-flex' : 'none';
  if (dbxState_.range === 'custom') {
    document.getElementById('dbxFrom').value = dbxState_.from || '';
    document.getElementById('dbxTo').value = dbxState_.to || '';
  }
  document.getElementById('dbxFStatus').value = dbxState_.status;
  if (dbxData_) {
    document.getElementById('dbxFTemplate').value = dbxState_.template;
    document.getElementById('dbxFLang').value = dbxState_.lang;
    document.getElementById('dbxFUser').value = dbxState_.user;
  }
  dbxRenderChips_();
  dbxRenderCustomize_();
  if (!dbxData_) return;

  const range = dbxRange_();
  const all = dbxData_.rows;
  const rows = all.filter(r => dbxInRange_(r, range) && dbxMatch_(r));
  let prev = null;
  if (range && isFinite(range[0])) {
    const len = range[1] - range[0];
    const pr = [range[0] - len, range[0]];
    prev = all.filter(r => dbxInRange_(r, pr) && dbxMatch_(r));
  }
  const ctx = { rows, prev, range, all };

  const sub = document.getElementById('dbxSub');
  sub.textContent = tr_('db2_sub_count', '{n} von {t} Projekten').replace('{n}', rows.length).replace('{t}', all.length) +
    ' · ' + (dbxData_.scope === 'all' ? tr_('db2_scope_all', 'alle Einreicher') : tr_('db2_scope_own', 'nur eigene / geteilte Projekte')) +
    ' · ' + tr_('db2_as_of', 'Stand') + ' ' + new Date(dbxData_.generatedAt).toLocaleString(calLocale_());

  const grid = document.getElementById('dbxGrid');
  grid.style.display = 'grid';
  grid.classList.toggle('editing', dbxEditing_);
  grid.innerHTML = dbxLoadLayout_().filter(w => w.show).map(w => {
    const def = DBX_WIDGETS_.find(d => d.id === w.id);
    if (def.scopeAll && dbxData_.scope !== 'all') return '';
    const body = dbxWidgetBody_(w.id, ctx);
    return '<section class="dbx-w s' + w.size + (w.id === 'kpis' ? ' plain' : '') + '" data-wid="' + w.id + '">' +
      '<div class="dbx-w-head"><div class="dbx-w-title">' + escapeHtml(dbxWTitle_(def)) + '</div>' +
      '<div class="dbx-w-tools">' + (body.tools || '') +
      '<button type="button" class="dbx-w-hide" data-act="hide" data-val="' + w.id + '" title="' + escapeHtml(tr_('db2_hide', 'Ausblenden')) + '"><span class="material-icons-outlined">visibility_off</span></button></div></div>' +
      body.html + '</section>';
  }).join('') || '<div class="dbx-empty" style="grid-column:1/-1;">' + escapeHtml(tr_('db2_all_hidden', 'Alle Kacheln ausgeblendet – über „Anpassen“ wieder einblenden.')) + '</div>';
}

function dbxRenderChips_() {
  const s = dbxState_;
  const chips = [];
  const add = (key, label) => chips.push('<span class="dbx-chip">' + escapeHtml(label) +
    '<button type="button" onclick="dbxSetFilter(\'' + key + '\',\'\')" title="' + escapeHtml(tr_('db2_remove', 'Entfernen')) + '"><span class="material-icons-outlined">close</span></button></span>');
  if (s.status) add('status', tr_('db2_f_status', 'Status') + ': ' + DBX_STATUS_[s.status].label);
  if (s.template) add('template', tr_('db2_f_template', 'Template') + ': ' + s.template);
  if (s.lang) add('lang', tr_('db2_f_lang', 'Sprache') + ': ' + s.lang);
  if (s.user) add('user', tr_('db2_f_user', 'Einreicher') + ': ' + s.user);
  if (s.q) add('q', tr_('db2_f_search', 'Suche') + ': ' + s.q);
  if (chips.length > 1) chips.push('<button type="button" class="dbx-chip-reset" onclick="dbxClearFilters()">' + escapeHtml(tr_('db2_clear_filters', 'Alle Filter zurücksetzen')) + '</button>');
  document.getElementById('dbxChips').innerHTML = chips.join('');
  document.getElementById('dbxFSearch').value = s.q;
}

function dbxClearFilters() {
  Object.assign(dbxState_, { status: '', template: '', lang: '', user: '', q: '' });
  dbxRender_();
}

function dbxWidgetBody_(id, ctx) {
  switch (id) {
    case 'kpis': return dbxKpis_(ctx);
    case 'trend': return dbxTrend_(ctx);
    case 'status': return dbxStatus_(ctx);
    case 'deadlines': return dbxDeadlines_(ctx);
    case 'templates': return dbxTop_(ctx.rows, r => r.template || tr_('db2_no_template', '(ohne Template)'), 'template', 8);
    case 'langs': return dbxTop_(ctx.rows, r => r.langs, 'lang', 10);
    case 'users': return dbxTop_(ctx.rows, r => r.owner, 'user', 8);
    case 'heat': return dbxHeat_(ctx);
  }
  return { html: '' };
}

function dbxFmt_(n) { return Number(n || 0).toLocaleString(calLocale_()); }

function dbxKpis_(ctx) {
  const calc = rows => {
    if (!rows) return null;
    const done = rows.filter(r => r.grp === 'done');
    const withDl = done.filter(r => !isNaN(r.dlT) && !isNaN(r.d));
    return {
      total: rows.length,
      open: rows.filter(r => r.grp === 'open').length,
      overdue: rows.filter(dbxIsOverdue_).length,
      done: done.length,
      ontime: withDl.length ? Math.round(100 * withDl.filter(r => r.dlT <= r.d).length / withDl.length) : null,
      words: rows.reduce((a, r) => a + (r.words || 0), 0),
      jobs: rows.reduce((a, r) => a + (r.langs.length || 0), 0),
      users: new Set(rows.map(r => r.owner).filter(Boolean)).size
    };
  };
  const cur = calc(ctx.rows), prev = calc(ctx.prev);

  // Mini-Verlauf je Kennzahl: Zeitraum in 12 gleich lange Abschnitte teilen.
  const withT = ctx.rows.filter(r => !isNaN(r.t));
  const from = ctx.range && isFinite(ctx.range[0]) ? ctx.range[0] : Math.min.apply(null, withT.map(r => r.t).concat([Date.now()]));
  const to = ctx.range ? Math.min(ctx.range[1], Date.now()) : Date.now();
  const N = 12, step = Math.max(1, (to - from) / N);
  const series = fn => {
    const out = new Array(N).fill(0);
    withT.forEach(r => { const k = Math.min(N - 1, Math.max(0, Math.floor((r.t - from) / step))); out[k] += fn(r); });
    return out;
  };
  const sparks = {
    total: series(() => 1),
    open: series(r => r.grp === 'open' ? 1 : 0),
    overdue: series(r => dbxIsOverdue_(r) ? 1 : 0),
    done: series(r => r.grp === 'done' ? 1 : 0),
    words: series(r => r.words || 0),
    jobs: series(r => r.langs.length)
  };
  const spark = (vals, color) => {
    if (!vals || !vals.some(v => v)) return '';
    const max = Math.max.apply(null, vals) || 1, W = 84, H = 30;
    const pts = vals.map((v, i) => [i * W / (vals.length - 1), H - 3 - (v / max) * (H - 6)]);
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    return '<svg class="dbx-spark" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">' +
      '<path d="' + line + ' L ' + W + ' ' + H + ' L 0 ' + H + ' ' + 'Z" fill="' + color + '" opacity="0.12"/>' +
      '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  };

  const tile = (key, icon, label, color, filterVal, suffix, invert, tip) => {
    const val = cur[key];
    let delta = '<span class="dbx-kpi-delta none">' + escapeHtml(prev ? tr_('db2_vs_prev', 'ggü. Vorperiode') : tr_('db2_all_time', 'Gesamtzeitraum')) + '</span>';
    if (prev && prev[key] !== null && val !== null && key !== 'overdue' && key !== 'open') {
      const diff = val - prev[key];
      const pct = prev[key] ? Math.round(100 * diff / prev[key]) : null;
      const good = invert ? diff < 0 : diff > 0;
      const txt = (diff > 0 ? '↑ ' : diff < 0 ? '↓ ' : '') + (key === 'ontime' ? Math.abs(diff) + ' ' + tr_('db2_pts', 'Pkt.') : (pct === null ? (diff > 0 ? '+' : '') + dbxFmt_(diff) : Math.abs(pct) + ' %'));
      delta = '<span class="dbx-kpi-delta ' + (diff === 0 ? '' : good ? 'up' : 'down') + '" title="' + escapeHtml(tr_('db2_prev_period', 'Vorperiode')) + ': ' + dbxFmt_(prev[key]) + '">' + (diff === 0 ? '± 0' : txt) + '</span>';
    }
    const act = filterVal ? ' ' + 'data-act="status" data-val="' + filterVal + '"' : '';
    const activeCls = filterVal && dbxState_.status === filterVal ? ' active' : '';
    return '<button type="button" class="dbx-kpi' + activeCls + '"' + act + (tip ? ' ' + 'data-tip="' + escapeHtml(tip) + '"' : '') +
      ' ' + 'style="--acc:' + color + ';--accbg:' + color + '1f;">' +
      '<div class="dbx-kpi-top"><span class="dbx-kpi-lbl">' + label + '</span>' +
        '<span class="dbx-kpi-ico"><span class="material-icons-outlined">' + icon + '</span></span></div>' +
      '<div class="dbx-kpi-num">' + (val === null ? '–' : dbxFmt_(val) + (suffix || '')) + '</div>' +
      '<div class="dbx-kpi-foot">' + delta + spark(sparks[key], color) + '</div></button>';
  };
  const hasWords = dbxData_.rows.some(r => r.words);
  const tileCount = 6 + (hasWords ? 1 : 0) + (dbxData_.scope === 'all' ? 1 : 0);
  let html = '<div class="dbx-kpis" style="--n:' + tileCount + ';">' +
    tile('total', 'folder_open', tr_('db2_k_total', 'Projekte'), '#111111', '', '', false, tr_('db2_k_total_tip', 'Alle Projekte im Zeitraum. Klick auf eine Kachel filtert das Dashboard.')) +
    tile('open', 'pending', tr_('db2_k_open', 'In Bearbeitung'), '#b08d00', 'open') +
    tile('overdue', 'warning_amber', tr_('db2_st_overdue', 'Überfällig'), '#c62828', 'overdue', '', true, tr_('db2_k_overdue_tip', 'Offene Projekte, deren Frist abgelaufen ist.')) +
    tile('done', 'task_alt', tr_('db2_st_done', 'Erledigt'), '#2e7d32', 'done') +
    tile('ontime', 'schedule', tr_('db2_k_ontime', 'Termintreue'), '#2a78d6', '', ' %', false, tr_('db2_k_ontime_tip', 'Anteil erledigter Projekte, die vor Fristende heruntergeladen wurden (nur Projekte mit Download-Zeitpunkt).')) +
    (hasWords ? tile('words', 'notes', tr_('db2_k_words', 'Wörter'), '#6d4bd1', '', '', false, tr_('db2_k_words_tip', 'Summe der Wörter laut Phrase-Analyse.')) : '') +
    tile('jobs', 'translate', tr_('db2_k_jobs', 'Sprach-Jobs'), '#0f8f86', '', '', false, tr_('db2_k_jobs_tip', 'Summe der Zielsprachen über alle Projekte.'));
  if (dbxData_.scope === 'all') html += tile('users', 'group', tr_('db2_f_user', 'Einreicher'), '#555555', '', '', false, tr_('db2_k_users_tip', 'Anzahl unterschiedlicher Einreicher.'));
  return { html: html + '</div>' };
}

function dbxBucketOf_(ms, unit) {
  const d = new Date(ms);
  if (unit === 'day') return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  if (unit === 'week') {
    const day = (d.getDay() + 6) % 7;
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() - day).getTime();
  }
  return new Date(d.getFullYear(), d.getMonth(), 1).getTime();
}

function dbxNextBucket_(ms, unit) {
  const d = new Date(ms);
  if (unit === 'day') return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
  if (unit === 'week') return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7).getTime();
  return new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime();
}

function dbxTrend_(ctx) {
  const rows = ctx.rows.filter(r => !isNaN(r.t));
  let from = ctx.range && isFinite(ctx.range[0]) ? ctx.range[0] : Math.min.apply(null, rows.map(r => r.t).concat([Date.now()]));
  const to = ctx.range ? Math.min(ctx.range[1], Date.now() + 86400000) : Date.now();
  const spanDays = (to - from) / 86400000;
  let unit = dbxState_.bucket;
  if (unit === 'auto') unit = spanDays <= 35 ? 'day' : spanDays <= 200 ? 'week' : 'month';
  const metric = dbxState_.metric;
  const val = r => metric === 'words' ? (r.words || 0) : metric === 'jobs' ? r.langs.length : 1;

  const buckets = [];
  const idx = {};
  let b = dbxBucketOf_(from, unit), guard = 0;
  while (b < to && guard++ < 400) { idx[b] = buckets.length; buckets.push({ start: b, end: dbxNextBucket_(b, unit), done: 0, open: 0, cancelled: 0 }); b = dbxNextBucket_(b, unit); }
  rows.forEach(r => { const k = dbxBucketOf_(r.t, unit); if (idx[k] !== undefined) buckets[idx[k]][r.grp] += val(r); });

  const seg = (act, cur, opts) => '<span class="dbx-mini-seg">' + opts.map(o =>
    '<button type="button" data-act="' + act + '" data-val="' + o[0] + '" class="' + (cur === o[0] ? 'active' : '') + '">' + o[1] + '</button>').join('') + '</span>';
  const tools = seg('metric', metric, [['projects', tr_('db2_k_total', 'Projekte')], ['jobs', tr_('db2_langs', 'Sprachen')], ['words', tr_('db2_k_words', 'Wörter')]]) + ' ' +
    seg('bucket', dbxState_.bucket, [['auto', tr_('db2_auto', 'Auto')], ['day', tr_('db2_day', 'Tag')], ['week', tr_('db2_week', 'Woche')], ['month', tr_('db2_month', 'Monat')]]);

  if (!buckets.length || !rows.length) return { tools, html: '<div class="dbx-empty">' + escapeHtml(tr_('db2_no_projects', 'Keine Projekte im gewählten Zeitraum.')) + '</div>' };

  const W = 1000, H = 240, padL = 0, padB = 10, padT = 10;
  const max = Math.max(1, ...buckets.map(x => x.done + x.open + x.cancelled));
  // 4 Gitterlinien mit "runden" Abstaenden; Zaehlwerte nur ganzzahlig.
  const niceMax = (() => {
    const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw)));
    let step = [1, 2, 5, 10].find(f => f * p >= raw) * p;
    if (metric !== 'words') step = Math.max(1, Math.ceil(step));
    return step * 4;
  })();
  const plotW = W - padL - 6, plotH = H - padB - padT;
  const bw = plotW / buckets.length;
  const gap = Math.min(14, bw * 0.3);
  const y = v => padT + plotH - (v / niceMax) * plotH;
  const fmtB = ms => {
    const d = new Date(ms);
    if (unit === 'month') return d.toLocaleDateString(calLocale_(), { month: 'short', year: '2-digit' });
    return d.toLocaleDateString(calLocale_(), { day: '2-digit', month: '2-digit' });
  };
  let svg = '<svg class="dbx-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="height:240px;">';
  for (let i = 0; i <= 4; i++) {
    const v = niceMax * i / 4, yy = y(v);
    svg += '<line x1="' + padL + '" x2="' + W + '" y1="' + yy + '" y2="' + yy + '" stroke="#ededed" stroke-width="1" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>';
  }
  const labelEvery = Math.max(1, Math.ceil(buckets.length / 12));
  const order = ['done', 'open', 'cancelled'];
  buckets.forEach((bk, i) => {
    const x = padL + i * bw + gap / 2, w = Math.max(1, bw - gap);
    let acc = 0;
    const total = bk.done + bk.open + bk.cancelled;
    order.forEach((k, oi) => {
      if (!bk[k]) return;
      const y0 = y(acc), y1 = y(acc + bk[k]);
      const isTop = order.slice(oi + 1).every(k2 => !bk[k2]);
      const hgt = Math.max(1, y0 - y1 - (acc > 0 ? 1 : 0));
      svg += '<rect x="' + x + '" y="' + y1 + '" width="' + w + '" height="' + hgt + '" fill="' + DBX_STATUS_[k].color + '"' + (isTop ? ' ' + 'rx="2"' : '') + '/>';
      acc += bk[k];
    });
    const endIncl = new Date(bk.end - 86400000);
    const tip = '<strong>' + fmtB(bk.start) + (unit !== 'day' ? ' – ' + endIncl.toLocaleDateString() : '') + '</strong><br>' +
      escapeHtml(tr_('db2_total', 'Gesamt')) + ': ' + dbxFmt_(total) + '<br>' + order.map(k => DBX_STATUS_[k].label + ': ' + dbxFmt_(bk[k])).join('<br>') +
      '<br><em style="color:#bbb;">' + escapeHtml(tr_('db2_click_zoom', 'Klick: auf diesen Zeitraum zoomen')) + '</em>';
    const f = new Date(bk.start), t2 = endIncl;
    const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    svg += '<rect x="' + (padL + i * bw) + '" y="' + padT + '" width="' + bw + '" height="' + plotH + '" fill="transparent" style="cursor:pointer" data-tip="' + escapeHtml(tip) + '" data-act="range" data-val="' + iso(f) + '|' + iso(t2) + '"/>';
  });
  svg += '</svg>';
  // Achsenbeschriftung als HTML (SVG ist horizontal gestreckt)
  let axis = '<div style="position:relative;height:16px;margin-left:44px;font-size:11px;color:#777;">';
  buckets.forEach((bk, i) => {
    if (i % labelEvery) return;
    axis += '<span style="position:absolute;left:' + ((i + 0.5) / buckets.length * 100) + '%;transform:translateX(-50%);white-space:nowrap;">' + fmtB(bk.start) + '</span>';
  });
  axis += '</div>';
  let yLabels = '<div style="position:relative;width:40px;flex-shrink:0;height:240px;font-size:11px;color:#777;">';
  for (let i = 0; i <= 4; i++) yLabels += '<span style="position:absolute;right:4px;top:' + (y(niceMax * i / 4) / H * 240 - 7) + 'px;">' + new Intl.NumberFormat(currentLang === 'de' ? 'de-DE' : 'en-US', { notation: 'compact', maximumFractionDigits: 1 }).format(niceMax * i / 4) + '</span>';
  yLabels += '</div>';
  const legend = '<div class="dbx-legend" style="margin-top:8px;">' + order.map(k =>
    '<button type="button" data-act="status" data-val="' + k + '"><i style="background:' + DBX_STATUS_[k].color + '"></i>' + DBX_STATUS_[k].label + '</button>').join('') + '</div>';
  return { tools, html: '<div style="display:flex;gap:4px;">' + yLabels + '<div style="flex:1;min-width:0;">' + svg + '</div></div>' + axis + legend };
}

function dbxStatus_(ctx) {
  const rows = ctx.all.filter(r => dbxInRange_(r, ctx.range) && dbxMatch_(r, 'status'));
  const counts = { done: 0, open: 0, overdue: 0, cancelled: 0 };
  rows.forEach(r => { if (dbxIsOverdue_(r)) counts.overdue++; else counts[r.grp]++; });
  const total = rows.length;
  if (!total) return { html: '<div class="dbx-empty">' + escapeHtml(tr_('db2_no_data', 'Keine Daten.')) + '</div>' };
  const R = 70, r0 = 46, C = 90;
  let a0 = -Math.PI / 2, svg = '<svg viewBox="0 0 180 180" style="width:180px;height:180px;flex-shrink:0;">';
  const keys = ['done', 'open', 'overdue', 'cancelled'];
  keys.forEach(k => {
    const v = counts[k];
    if (!v) return;
    const frac = v / total;
    const a1 = a0 + frac * Math.PI * 2 - (frac < 1 ? 0.02 : 0);
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const p = (a, rad) => (C + rad * Math.cos(a)).toFixed(2) + ' ' + (C + rad * Math.sin(a)).toFixed(2);
    const path = frac >= 1
      ? 'M ' + p(0, R) + ' A ' + R + ' ' + R + ' 0 1 1 ' + p(Math.PI, R) + ' A ' + R + ' ' + R + ' 0 1 1 ' + p(0, R) + ' M ' + p(0, r0) + ' A ' + r0 + ' ' + r0 + ' 0 1 0 ' + p(Math.PI, r0) + ' A ' + r0 + ' ' + r0 + ' 0 1 0 ' + p(0, r0) + ' Z'
      : 'M ' + p(a0, R) + ' A ' + R + ' ' + R + ' 0 ' + large + ' 1 ' + p(a1, R) + ' L ' + p(a1, r0) + ' A ' + r0 + ' ' + r0 + ' 0 ' + large + ' 0 ' + p(a0, r0) + ' Z';
    const sel = dbxState_.status === k;
    svg += '<path d="' + path + '" fill="' + DBX_STATUS_[k].color + '" fill-rule="evenodd" style="cursor:pointer;' + (dbxState_.status && !sel ? 'opacity:0.35;' : '') + '" data-act="status" data-val="' + k + '" data-tip="' + escapeHtml('<strong>' + DBX_STATUS_[k].label + '</strong><br>' + dbxFmt_(v) + ' (' + Math.round(frac * 100) + ' %)') + '"/>';
    a0 = a0 + frac * Math.PI * 2;
  });
  svg += '<text x="90" y="88" text-anchor="middle" style="font-size:26px;font-weight:800;fill:#111;">' + dbxFmt_(total) + '</text>' +
    '<text x="90" y="108" text-anchor="middle" style="font-size:11px;fill:#777;">' + escapeHtml(tr_('db2_k_total', 'Projekte')) + '</text></svg>';
  const legend = '<div style="display:flex;flex-direction:column;gap:8px;flex:1;min-width:140px;">' + keys.map(k =>
    '<button type="button" data-act="status" data-val="' + k + '" style="display:flex;align-items:center;gap:8px;background:none;border:none;padding:4px 0;cursor:pointer;font:inherit;font-size:13px;text-align:left;' + (dbxState_.status === k ? 'font-weight:800;' : '') + '">' +
      '<span class="material-icons-outlined" style="font-size:18px;color:' + DBX_STATUS_[k].color + '">' + DBX_STATUS_[k].icon + '</span>' +
      '<span style="flex:1;">' + DBX_STATUS_[k].label + '</span><strong>' + dbxFmt_(counts[k]) + '</strong>' +
      '<span style="color:#888;width:44px;text-align:right;">' + Math.round(100 * counts[k] / total) + ' %</span></button>').join('') + '</div>';
  return { html: '<div class="dbx-donut-wrap">' + svg + legend + '</div>' };
}

function dbxTop_(rows, keyFn, act, limit) {
  const m = {};
  rows.forEach(r => [].concat(keyFn(r)).forEach(k => { if (k) m[k] = (m[k] || 0) + 1; }));
  const list = Object.keys(m).map(k => ({ k, v: m[k] })).sort((a, b) => b.v - a.v);
  if (!list.length) return { html: '<div class="dbx-empty">' + escapeHtml(tr_('db2_no_data', 'Keine Daten.')) + '</div>' };
  const shown = list.slice(0, limit);
  const rest = list.slice(limit).reduce((a, x) => a + x.v, 0);
  const max = shown[0].v;
  const total = list.reduce((a, x) => a + x.v, 0);
  let html = '<div class="dbx-hbar">' + shown.map((x, i) =>
    '<div class="dbx-hbar-row' + (dbxState_[act] === x.k ? ' sel' : '') + '" data-act="' + act + '" data-val="' + escapeHtml(x.k) + '" data-tip="' + escapeHtml('<strong>' + escapeHtml(x.k) + '</strong><br>' + dbxFmt_(x.v) + ' (' + Math.round(100 * x.v / total) + ' %)<br><em style="color:#bbb;">' + escapeHtml(tr_('db2_click_filter', 'Klick: filtern')) + '</em>') + '">' +
      '<span class="dbx-hbar-rank">' + (i + 1) + '</span>' +
      '<div class="dbx-hbar-lbl">' + escapeHtml(x.k) + '</div>' +
      '<div class="dbx-hbar-track"><div class="dbx-hbar-fill" style="width:' + (100 * x.v / max) + '%"></div></div>' +
      '<div class="dbx-hbar-val">' + dbxFmt_(x.v) + '</div></div>').join('') + '</div>';
  if (rest) html += '<div style="font-size:12px;color:#888;margin-top:10px;">' + escapeHtml(tr_('db2_more', '+ {n} weitere').replace('{n}', list.length - limit)) + ' (' + dbxFmt_(rest) + ')</div>';
  return { html };
}

function dbxDeadlines_(ctx) {
  // Fristen gelten unabhaengig vom Einreichungszeitraum - nur die anderen Filter greifen.
  const now = Date.now();
  const open = ctx.all.filter(r => r.grp === 'open' && !isNaN(r.d) && dbxMatch_(r, 'status'));
  const overdue = open.filter(r => r.d < now).sort((a, b) => a.d - b.d);
  const soon = open.filter(r => r.d >= now && r.d < now + 14 * 86400000).sort((a, b) => a.d - b.d);
  const item = (r, over) => {
    const days = Math.round((r.d - now) / 86400000);
    const badge = over
      ? '<span class="dbx-badge" style="background:#fdecea;color:#c62828;">' + escapeHtml(tr_('db2_days_overdue', '{n} T überfällig').replace('{n}', Math.abs(days))) + '</span>'
      : '<span class="dbx-badge" style="background:' + (days <= 2 ? '#fff4e0;color:#a15c00' : '#f1f5fb;color:#335') + ';">' + escapeHtml(days <= 0 ? tr_('db2_today', 'heute') : tr_('db2_in_days', 'in {n} T').replace('{n}', days)) + '</span>';
    return '<li style="cursor:pointer;" data-act="open" data-val="' + escapeHtml(r.uid) + '" data-tip="' + escapeHtml(escapeHtml(tr_('db2_due', 'Frist')) + ': ' + new Date(r.d).toLocaleString(calLocale_()) + (r.owner ? '<br>' + escapeHtml(r.owner) : '') + '<br><em style="color:#bbb;">' + escapeHtml(tr_('db2_click_open', 'Klick: in „Meine Projekte“ öffnen')) + '</em>') + '">' +
      '<div style="min-width:0;"><div class="n">' + escapeHtml(r.name || r.uid) + '</div><div class="m">' + escapeHtml(r.template || '') + (r.langs.length ? ' · ' + escapeHtml(r.langs.join(', ')) : '') + '</div></div>' + badge + '</li>';
  };
  if (!overdue.length && !soon.length) return { html: '<div class="dbx-empty">' + escapeHtml(tr_('db2_no_deadlines', 'Keine offenen Fristen in den nächsten 14 Tagen.')) + ' 🎉</div>' };
  return { html: '<ul class="dbx-list">' + overdue.map(r => item(r, true)).join('') + soon.map(r => item(r, false)).join('') + '</ul>' };
}

function dbxHeat_(ctx) {
  const grid = Array.from({ length: 7 }, () => new Array(24).fill(0));
  ctx.rows.forEach(r => { if (isNaN(r.t)) return; const d = new Date(r.t); grid[(d.getDay() + 6) % 7][d.getHours()]++; });
  const max = Math.max(0, ...grid.map(row => Math.max(...row)));
  if (!max) return { html: '<div class="dbx-empty">' + escapeHtml(tr_('db2_no_data', 'Keine Daten.')) + '</div>' };
  // 1.1.2024 war ein Montag -> Wochentagskuerzel in der Oberflaechensprache.
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => new Date(2024, 0, 1 + i).toLocaleDateString(calLocale_(), { weekday: 'short' }));
  let html = '<div class="dbx-heat"><div></div>';
  for (let h = 0; h < 24; h++) html += '<div style="text-align:center;">' + (h % 3 === 0 ? h : '') + '</div>';
  grid.forEach((row, di) => {
    html += '<div style="display:flex;align-items:center;">' + days[di] + '</div>';
    row.forEach((v, h) => {
      const a = v ? 0.15 + 0.85 * (v / max) : 0;
      html += '<div class="c" style="' + (v ? 'background:rgba(42,120,214,' + a.toFixed(2) + ');' : '') + '" data-tip="' + escapeHtml('<strong>' + days[di] + ', ' + h + ':00–' + (h + 1) + ':00</strong><br>' + escapeHtml(tr_('db2_submissions', '{n} Einreichung(en)').replace('{n}', v))) + '"></div>';
    });
  });
  html += '</div><div style="display:flex;align-items:center;gap:6px;font-size:11px;color:#777;margin-top:8px;">' + escapeHtml(tr_('db2_less', 'weniger')) + ' ' +
    [0.15, 0.4, 0.65, 1].map(a => '<i style="width:12px;height:12px;display:inline-block;border-radius:2px;background:rgba(42,120,214,' + a + ');"></i>').join('') + ' ' + escapeHtml(tr_('db2_more_word', 'mehr')) + '</div>';
  return { html };
}

function dbxOpenProject_(uid) {
  switchTab('history');
  setTimeout(() => {
    const inp = document.getElementById('globalSearchInput');
    if (inp) { inp.value = uid; globalSearch(); }
  }, 300);
}

function dbxExportCsv() {
  if (!dbxData_) return;
  const range = dbxRange_();
  const rows = dbxData_.rows.filter(r => dbxInRange_(r, range) && dbxMatch_(r));
  const head = [tr_('jx_8e3a421', 'Project Name'), tr_('jx_b3acfd2', 'Phrase ID'), tr_('jx_5c835c2', 'Submitted'), tr_('jx_ba8c2c3', 'Submitter'), tr_('jx_278c491', 'Template'), tr_('jx_ec53a8c', 'Status'), tr_('jx_14c841e', 'Due Date'), tr_('jx_01efc27', 'Target Languages'), tr_('jx_6f15b8d', 'Words')];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = rows.map(r => [r.name, r.uid, r.ts ? new Date(r.ts).toLocaleString() : '', r.owner, r.template,
    dbxIsOverdue_(r) ? 'OVERDUE' : r.status, r.due ? new Date(r.due).toLocaleString() : '', r.langs.join(' '), r.words || ''].map(q).join(','));
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,﻿' + encodeURIComponent([head.join(',')].concat(lines).join('\n'));
  a.download = 'dashboard_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
}
</script>
